<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forge</title><style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--a:#9da6ff;--b:#d9b55d;--bg:#090b14;--panel:#101322;--line:#ffffff12;--text:#f0f2fa;--muted:#778096;--mono:"Cascadia Code","JetBrains Mono","Consolas",monospace}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:"Segoe UI Variable","Segoe UI",sans-serif;background:radial-gradient(circle at 70% 0,#9da6ff0d,transparent 25%),var(--bg);color:var(--text)}button,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:64px 1fr}.top{display:flex;align-items:center;gap:13px;padding:0 15px;border-bottom:1px solid var(--line);background:#090b14e8;backdrop-filter:blur(24px)}.brand{display:flex;align-items:center;gap:10px;min-width:190px}.logo{width:37px;height:37px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));color:#090b14;display:grid;place-items:center;font:950 11px var(--mono)}.brand b{font-size:11px;letter-spacing:.18em}.brand small{display:block;color:#69758c;font-size:6px;letter-spacing:.14em;margin-top:3px}.tabs{display:flex;gap:4px}.tab{height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:#ffffff03;color:#78839a;font-size:8px}.tab.active{color:#fff;border-color:#9da6ff44;background:#9da6ff0d}.tools{margin-left:auto;display:flex;gap:5px}.win{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:#78839a}.win:hover{background:#ffffff08;color:#fff}.main{padding:18px;overflow:hidden}.workspace{height:100%;display:grid;grid-template-columns:1fr 320px;gap:11px}.editor,.inspector{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#ffffff07,#ffffff02);box-shadow:0 26px 85px #0008;min-height:0}.editor{display:grid;grid-template-rows:48px 1fr}.editorHead{display:flex;align-items:center;gap:7px;padding:0 11px;border-bottom:1px solid var(--line)}.editorHead span{width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 10px var(--a)}.editorHead small{color:#6f7b92;font:700 7px var(--mono)}textarea{width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;padding:18px;color:#dfe5f5;font:12px var(--mono);line-height:1.8}.inspector{padding:14px;overflow:auto}.ey{color:var(--a);font:800 7px var(--mono);letter-spacing:.16em}.title{font-size:17px;font-weight:850;margin:7px 0}.desc{color:#707b91;font-size:8px;line-height:1.7}.stack{display:grid;gap:7px;margin-top:14px}.action{height:39px;border:1px solid var(--line);border-radius:10px;background:#ffffff04;color:#aeb6c8;text-align:left;padding:0 10px;font-size:8px}.action:hover{border-color:#9da6ff44;background:#9da6ff08}.primary{background:linear-gradient(135deg,var(--a),#7984df);border:0;color:#090b14;font-weight:900}.result{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}.result pre{white-space:pre-wrap;word-break:break-word;color:#91a4ff;font:10px var(--mono);line-height:1.7}.status{padding:9px;border-radius:9px;background:#ffffff03;border:1px solid var(--line);color:#718097;font-size:7px;margin-top:10px}.kbd{font:700 7px var(--mono);padding:3px 5px;border:1px solid var(--line);border-radius:6px;color:#9aa4b6}@media(max-width:900px){.workspace{grid-template-columns:1fr}.inspector{display:none}.tabs{display:none}}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 78% 2%,#9da6ff0d,transparent 25%),radial-gradient(circle at 10% 100%,#d9b55d08,transparent 24%);animation:ambient 10s ease-in-out infinite}.soundBtn{height:30px;padding:0 9px;border:1px solid #9da6ff2e;border-radius:8px;background:#ffffff04;color:#9da6ff;font:800 6px "JetBrains Mono";cursor:pointer}.app{position:relative;z-index:1}@keyframes ambient{50%{transform:translateY(-5px);opacity:.7}}</style></head><body><div class="ambient"></div><div class="app"><header class="top"><div class="brand"><div class="logo">FG</div><div><b>FORGE</b><small>DEVELOPER WORKBENCH</small></div></div><div class="tabs"><button class="tab active" data-mode="json">JSON</button><button class="tab" data-mode="text">TEXT</button><button class="tab" data-mode="encode">ENCODE</button></div><div class="tools"><span class="kbd">Ctrl / Enter</span><button class="soundBtn" id="soundBtn">SFX ON</button><button class="win" data-win="min">—</button><button class="win" data-win="max">□</button><button class="win" data-win="close">×</button></div></header><main class="main"><div class="workspace"><section class="editor"><div class="editorHead"><span></span><small id="modeLabel">JSON TRANSFORM</small><span style="opacity:.4"></span><small>LOCAL TOOLCHAIN</small></div><textarea id="input" spellcheck="false">{ "name": "AdLand", "version": 1, "features": ["focus","canvas","telemetry"] }</textarea></section><aside class="inspector"><div class="ey">FORGE / ACTIONS</div><div class="title">Make the data useful.</div><div class="desc">A compact local workbench for transforming developer data without sending it anywhere.</div><div class="stack"><button class="action primary" id="run">RUN TRANSFORM</button><button class="action" id="pretty">PRETTY JSON</button><button class="action" id="minify">MINIFY JSON</button><button class="action" id="copy">COPY RESULT</button><button class="action" id="clear">CLEAR</button></div><div class="result"><div class="ey">RESULT</div><pre id="result">Ready.</pre><div class="status" id="status">Mode: JSON · Shortcut: Ctrl+Enter</div></div></aside></div></main></div><script>
let mode='json';const $=id=>document.getElementById(id),input=$('input'),res=$('result'),status=$('status');function jsonPretty(min=false){try{const x=JSON.parse(input.value);return JSON.stringify(x,null,min?0:2)}catch(e){return 'JSON ERROR: '+e.message}}function enc(op){try{const v=input.value;return op==='b64'?btoa(unescape(encodeURIComponent(v))):encodeURIComponent(v)}catch(e){return String(e)}}function run(action='run'){if(mode==='json'){res.textContent=action==='min'?jsonPretty(true):jsonPretty(false)}else if(mode==='encode'){res.textContent=enc(action==='b64'?'b64':'url')}else{res.textContent=input.value.split(/\\s+/).filter(Boolean).length+' tokens · '+input.value.length+' chars';}status.textContent='Completed · '+new Date().toLocaleTimeString()}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('modeLabel').textContent=mode==='json'?'JSON TRANSFORM':mode==='text'?'TEXT ANALYSIS':'ENCODE / DECODE';status.textContent='Mode: '+mode.toUpperCase()});$('run').onclick=()=>run();$('pretty').onclick=()=>{mode='json';res.textContent=jsonPretty(false)};$('minify').onclick=()=>{mode='json';res.textContent=jsonPretty(true)};$('copy').onclick=async()=>{await navigator.clipboard.writeText(res.textContent);status.textContent='Result copied to clipboard'};$('clear').onclick=()=>{input.value='';res.textContent='Ready.'};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')run()});document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>window.forge.window(b.dataset.win));
const sb=document.getElementById('soundBtn');let sfx=localStorage.getItem('forge-sfx')!=='off';function tone(){if(!sfx)return;try{const A=window.__forgeAudio||(window.__forgeAudio=new(window.AudioContext||window.webkitAudioContext)());if(A.state==='suspended')A.resume();const o=A.createOscillator(),g=A.createGain(),n=A.currentTime;o.type='triangle';o.frequency.setValueAtTime(420,n);o.frequency.exponentialRampToValueAtTime(690,n+.07);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.014,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.1);o.connect(g).connect(A.destination);o.start(n);o.stop(n+.11)}catch(e){}}sb.textContent='SFX '+(sfx?'ON':'OFF');sb.onclick=()=>{sfx=!sfx;localStorage.setItem('forge-sfx',sfx?'on':'off');sb.textContent='SFX '+(sfx?'ON':'OFF');tone()};document.querySelectorAll('button').forEach(x=>x.addEventListener('pointerdown',tone,{passive:true}));</script></body></html>
