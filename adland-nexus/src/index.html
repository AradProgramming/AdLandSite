function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>'<button class="'+(store.page===n.id?'active':'')+'" data-go="'+n.id+'"><i>'+n.icon+'</i><span>'+tr(n.id)+'</span>'+(n.id==='tasks'?'<em class="badge">'+store.tasks.filter(x=>!x.done).length+'</em>':'')+'</button>').join('')}
let timer=null,watchTimer=null;
function render(){applyLang();renderNav();const v=document.getElementById('view');v.innerHTML=store.page==='overview'?overview():store.page==='tasks'?tasks():store.page==='notes'?notes():store.page==='snippets'?snippets():store.page==='board'?board():store.page==='focus'?focus():store.page==='tools'?toolsPage():settings();bind();if(store.page==='tools'&&window.nexus)window.nexus.system().then(x=>{const u=Math.round((x.total-x.free)/x.total*100);document.getElementById('facts').innerHTML='<div class="fact"><b>'+tr('host')+'</b><p>'+esc(x.host)+'</p></div><div class="fact"><b>'+tr('cpu')+'</b><p>'+esc(x.cpu)+'</p></div><div class="fact"><b>'+tr('cores')+'</b><p>'+x.cores+'</p></div><div class="fact"><b>'+tr('memory')+'</b><p>'+u+'% '+tr('used')+'</p></div><div class="fact"><b>'+tr('os')+'</b><p>'+esc(x.release)+'</p></div><div class="fact"><b>'+tr('arch')+'</b><p>'+esc(x.arch)+'</p></div>'}).catch(()=>{if(document.getElementById('facts'))document.getElementById('facts').textContent=tr('systemUnavailable')})}
function sfx(kind='click'){if(!store.soundOn||store.reduced)return;try{const C=window.__audio||(window.__audio=new (window.AudioContext||window.webkitAudioContext)());if(C.state==='suspended')C.resume();const o=C.createOscillator(),g=C.createGain(),now=C.currentTime;const f=kind==='success'?[650,900]:kind==='error'?[160,110]:[310,460];o.type='sine';o.frequency.setValueAtTime(f[0],now);o.frequency.exponentialRampToValueAtTime(f[1],now+.06);g.gain.setValueAtTime(.0001,now);g.gain.exponentialRampToValueAtTime(.032,now+.008);g.gain.exponentialRampToValueAtTime(.0001,now+.085);o.connect(g).connect(C.destination);o.start(now);o.stop(now+.09)}catch(e){}}
function evalCalc(exp){const t=(exp.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').match(/\d*\.?\d+|[()+\-*/%]/g)||[]);if(!t.length)throw 0;const out=[],ops=[];let prev='op';for(const x of t){if(/^\d|^\./.test(x)){out.push(+x);prev='num';continue}if(x==='('){ops.push(x);prev='(';continue}if(x===')'){while(ops.length&&ops.at(-1)!=='(')out.push(ops.pop());if(ops.pop()!=='(')throw 0;prev='num';continue}let op=x;if(op==='-'&&(prev==='op'||prev==='('))out.push(0);const pr=op==='+'||op==='-'?1:2;while(ops.length&&ops.at(-1)!=='('&&(ops.at(-1)==='+'||ops.at(-1)==='-'?1:2)>=pr)out.push(ops.pop());ops.push(op);prev='op'}while(ops.length){const x=ops.pop();if(x==='(')throw 0;out.push(x)}const st=[];for(const x of out){if(typeof x==='number')st.push(x);else{const b=st.pop(),a=st.pop();if(a===undefined||b===undefined)throw 0;st.push(x==='+'?a+b:x==='-'?a-b:x==='*'?a*b:x==='/'?(b===0?NaN:a/b):a%b)}}const v=st[0];if(!Number.isFinite(v))throw 0;return Math.round(v*1e10)/1e10}
function calcRender(){const e=document.getElementById('calcExpr'),v=document.getElementById('calcValue');if(e)e.textContent=store.calcExpr||'';if(v){try{v.textContent=store.calcExpr?String(evalCalc(store.calcExpr)):'0'}catch{v.textContent=store.calcExpr||'0'}}const h=document.getElementById('calcHistory');if(h)h.innerHTML=store.calcHistory.length?store.calcHistory.map((x,i)=>'<div class="historyLine" data-history="'+i+'"><b>'+esc(x.result)+'</b><small>'+esc(x.expr)+'</small></div>').join(''):'<div class="muted" style="font-size:8px;padding:10px 0">'+tr('emptyHistory')+'</div>'}
function calcPress(k){sfx();if(k==='C')store.calcExpr='';else if(k==='⌫')store.calcExpr=(store.calcExpr||'').slice(0,-1);else if(k==='±')store.calcExpr=store.calcExpr.startsWith('-')?store.calcExpr.slice(1):'-'+store.calcExpr;else if(k==='='){try{const result=evalCalc(store.calcExpr);store.calcHistory.unshift({expr:store.calcExpr,result:String(result)});store.calcHistory=store.calcHistory.slice(0,18);store.calcExpr=String(result);sfx('success')}catch{toast('Invalid expression');sfx('error')}}else store.calcExpr+=(k==='×'||k==='÷'||k==='−'?k:k);save();calcRender()}
function bind(){
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const t=store.tasks.find(x=>x.id==b.dataset.toggle);if(t){t.done=!t.done;save();render()}});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{store.tasks=store.tasks.filter(x=>x.id!=b.dataset.del);save();render()});
document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{store.activeNote=+b.dataset.note;save();render()});
document.querySelectorAll('[data-snip]').forEach(b=>b.onclick=()=>{store.activeSnippet=+b.dataset.snip;save();render()});
const addTask=document.getElementById('addTask');if(addTask)addTask.onclick=()=>{const title=document.getElementById('taskTitle').value.trim();if(!title)return toast(tr('writeTask'));store.tasks.unshift({id:Date.now(),title,project:document.getElementById('taskProject').value.trim()||'General',p:document.getElementById('taskPrio').value,done:false});save();render();toast(tr('taskAdded'))};
const addNote=document.getElementById('addNote');if(addNote)addNote.onclick=()=>{const n={id:Date.now(),title:tr('captureTitle'),body:'',date:Date.now()};store.notes.unshift(n);store.activeNote=n.id;save();render()};
const saveNote=document.getElementById('saveNote');if(saveNote)saveNote.onclick=()=>{const n=store.notes.find(x=>x.id===store.activeNote);if(n){n.title=document.getElementById('noteTitle').value;n.body=document.getElementById('noteBody').value;n.date=Date.now();save();render();toast(tr('noteSaved'))}};
const delNote=document.getElementById('delNote');if(delNote)delNote.onclick=()=>{store.notes=store.notes.filter(x=>x.id!==store.activeNote);store.activeNote=store.notes[0]?.id||0;save();render()};
const addSnippet=document.getElementById('addSnippet');if(addSnippet)addSnippet.onclick=()=>{const s={id:Date.now(),title:'Untitled snippet',lang:'Shell',body:''};store.snippets.unshift(s);store.activeSnippet=s.id;save();render()};
const saveSnip=document.getElementById('saveSnip');if(saveSnip)saveSnip.onclick=()=>{const s=store.snippets.find(x=>x.id===store.activeSnippet);if(s){s.title=document.getElementById('snTitle').value;s.lang=document.getElementById('snLang').value;s.body=document.getElementById('snBody').value;save();render();toast(tr('snippetSaved'))}};
const copySnip=document.getElementById('copySnip');if(copySnip)copySnip.onclick=()=>{navigator.clipboard.writeText(store.snippets.find(x=>x.id===store.activeSnippet)?.body||'');toast(tr('copied'))};
const delSnip=document.getElementById('delSnip');if(delSnip)delSnip.onclick=()=>{store.snippets=store.snippets.filter(x=>x.id!==store.activeSnippet);store.activeSnippet=store.snippets[0]?.id||0;save();render()};
const calc=document.getElementById('calc');if(calc)calc.oninput=()=>{try{if(!/^[0-9+\-*/().%\s]+$/.test(calc.value))throw 0;document.getElementById('result').textContent=calc.value?String(Function('"use strict";return ('+calc.value+')')()):'—'}catch(e){document.getElementById('result').textContent='—'}};
const ft=document.getElementById('toggleFocus');if(ft)ft.onclick=()=>{store.focusRunning=!store.focusRunning;save();render();startFocusTimer()};
const mode=document.getElementById('mode');if(mode)mode.onclick=()=>{store.focusMode=store.focusMode==='Focus'?'Break':'Focus';store.focusSec=(store.focusMode==='Focus'?store.defaultFocus:store.defaultBreak)*60;store.focusRunning=false;save();render()};
const rf=document.getElementById('resetFocus');if(rf)rf.onclick=()=>{store.focusSec=(store.focusMode==='Focus'?store.defaultFocus:store.defaultBreak)*60;store.focusRunning=false;save();render()};
document.querySelectorAll('[data-preset]').forEach(x=>x.onclick=()=>{store.defaultFocus=+x.dataset.preset;store.focusMode='Focus';store.focusSec=store.defaultFocus*60;store.focusRunning=false;save();render();toast(store.defaultFocus+'m')});
const cp=document.getElementById('customPreset');if(cp)cp.onclick=()=>{const n=Number(prompt(store.lang==='fa'?'مدت تمرکز به دقیقه':'Focus length in minutes',String(store.defaultFocus)));if(Number.isFinite(n)&&n>=5&&n<=120){store.defaultFocus=Math.round(n);store.focusMode='Focus';store.focusSec=store.defaultFocus*60;save();render()}};
const language=document.getElementById('language');if(language)language.onchange=()=>{store.lang=language.value;save();render()};
const accent=document.getElementById('accent');if(accent)accent.oninput=()=>{store.accent=accent.value;save();applyLang()};
const fr=document.getElementById('focusRange'),fv=document.getElementById('focusRangeValue');if(fr){fr.oninput=()=>{store.defaultFocus=+fr.value;fv.textContent=fr.value+'m';save()};fr.onchange=()=>{if(store.focusMode==='Focus'&&!store.focusRunning){store.focusSec=store.defaultFocus*60;render()}}}
const br=document.getElementById('breakRange'),bv=document.getElementById('breakRangeValue');if(br){br.oninput=()=>{store.defaultBreak=+br.value;bv.textContent=br.value+'m';save()};br.onchange=()=>{if(store.focusMode==='Break'&&!store.focusRunning){store.focusSec=store.defaultBreak*60;render()}}}
const ab=document.getElementById('autoBreak');if(ab)ab.onclick=()=>{store.autoBreak=!store.autoBreak;save();render()};
const rd=document.getElementById('reduced');if(rd)rd.onclick=()=>{store.reduced=!store.reduced;save();applyLang();render()};
const ex=document.getElementById('export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='adland-nexus-workspace.json';a.click();toast(tr('exported'))};
const im=document.getElementById('import');if(im)im.onchange=async()=>{try{store=Object.assign({},base,JSON.parse(await im.files[0].text()));save();render();toast(tr('imported'))}catch(e){toast(tr('importFailed'))}};
const wt=document.getElementById('watchToggle');if(wt)wt.onclick=()=>{store.watchRunning=!store.watchRunning;save();render();startWatchTimer()};
const wr=document.getElementById('watchReset');if(wr)wr.onclick=()=>{store.stopwatch=0;store.watchRunning=false;save();render()};
}
// Nexus 1.2 interaction layer
document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const t=store.tasks.find(x=>x.id==b.dataset.move);if(!t)return;const order=['backlog','doing','done'];const st=t.status||(t.done?'done':'backlog');const ni=Math.max(0,Math.min(2,order.indexOf(st)+(Number(b.dataset.dir)||0)));t.status=order[ni];t.done=t.status==='done';save();sfx('success');render()});
document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>calcPress(b.dataset.calc));
document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{store.calcExpr=store.calcHistory[+b.dataset.history]?.expr||'';save();calcRender();sfx()});
const clearHistory=document.getElementById('clearHistory');if(clearHistory)clearHistory.onclick=()=>{store.calcHistory=[];save();calcRender();sfx()};
const uuidGen=document.getElementById('uuidGen');if(uuidGen)uuidGen.onclick=()=>{document.getElementById('uuidOut').textContent=crypto.randomUUID();sfx('success')};
const uuidCopy=document.getElementById('uuidCopy');if(uuidCopy)uuidCopy.onclick=()=>{navigator.clipboard.writeText(document.getElementById('uuidOut').textContent);toast(tr('copied'));sfx()};
const stamp=document.getElementById('stampOut');if(stamp&&(!stamp.textContent||stamp.textContent==='—'))stamp.textContent=new Date().toISOString();
const stampCopy=document.getElementById('stampCopy');if(stampCopy)stampCopy.onclick=()=>{navigator.clipboard.writeText(document.getElementById('stampOut').textContent);toast(tr('copied'));sfx()};
const soundToggle=document.getElementById('soundToggle');if(soundToggle)soundToggle.onclick=()=>{store.soundOn=!store.soundOn;save();render();if(store.soundOn)sfx('success')};

function startFocusTimer(){clearInterval(timer);if(!store.focusRunning)return;timer=setInterval(()=>{if(store.focusSec>0){store.focusSec--;save();const x=document.getElementById('time');if(x)x.textContent=fmtSec(store.focusSec)}else{store.focusRunning=false;clearInterval(timer);save();toast(store.focusMode==='Focus'?tr('focusComplete'):tr('breakComplete'));if(store.focusMode==='Focus'&&store.autoBreak){store.focusMode='Break';store.focusSec=store.defaultBreak*60;store.focusRunning=true;save();render();startFocusTimer()}else render()}},1000)}
function startWatchTimer(){clearInterval(watchTimer);if(!store.watchRunning)return;watchTimer=setInterval(()=>{store.stopwatch+=1;save();const x=document.getElementById('watch');if(x)x.textContent=(Math.floor(store.stopwatch/600)).toString().padStart(2,'0')+':'+(Math.floor(store.stopwatch/10)%60).toString().padStart(2,'0')+'.'+(store.stopwatch%10)},100); }
function openQuick(){document.getElementById('quickModal').classList.add('open');document.getElementById('quickTitle').value='';document.getElementById('quickBody').value='';document.getElementById('quickTitle').placeholder=tr('captureTitle');document.getElementById('quickBody').placeholder=tr('captureBody');document.getElementById('quickTitle').focus()}
function closeQuick(){document.getElementById('quickModal').classList.remove('open')}
function openPalette(){document.getElementById('palette').classList.add('open');document.getElementById('palInput').value='';document.getElementById('palInput').placeholder=tr('search');document.getElementById('palInput').focus();drawPalette('')}
function closePalette(){document.getElementById('palette').classList.remove('open')}
function drawPalette(q){const items=NAV.filter(n=>(n.id+' '+tr(n.id)).toLowerCase().includes(q.toLowerCase()));document.getElementById('palItems').innerHTML=items.map(n=>'<div class="palitem" data-pal="'+n.id+'">'+n.icon+' &nbsp; '+tr(n.id)+'</div>').join('')||'<div class="palitem">'+tr('noCommand')+'</div>';document.querySelectorAll('[data-pal]').forEach(x=>x.onclick=()=>{go(x.dataset.pal);closePalette()})}
document.getElementById('search').onclick=openPalette;document.getElementById('palInput').oninput=e=>drawPalette(e.target.value);document.getElementById('palette').onclick=e=>{if(e.target.id==='palette')closePalette()};
document.getElementById('closeQuick').onclick=closeQuick;document.getElementById('quickModal').onclick=e=>{if(e.target.id==='quickModal')closeQuick()};document.getElementById('openQuick')?.addEventListener('click',openQuick);document.getElementById('saveQuick').onclick=()=>{const title=document.getElementById('quickTitle').value.trim()||tr('captureTitle');const body=document.getElementById('quickBody').value;const n={id:Date.now(),title,body,date:Date.now()};store.notes.unshift(n);store.activeNote=n.id;save();closeQuick();go('notes');toast(tr('savedToast'))};
document.querySelectorAll('[data-win]').forEach(x=>x.onclick=()=>window.nexus&&window.nexus.window(x.dataset.win));
document.addEventListener('keydown',e=>{if(store.page==='tools'){if('0123456789.+-*/()%'.includes(e.key)){const m={'*':'×','/':'÷','-':'−'};calcPress(m[e.key]||e.key);return}if(e.key==='Enter'){calcPress('=');return}if(e.key==='Backspace'){calcPress('⌫');return}}if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.code==='Space'){e.preventDefault();openPalette()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openQuick()}if(e.key==='Escape'){closePalette();closeQuick()}});
window.nexus?.onPalette(openPalette);document.addEventListener('pointerdown',e=>{if(e.target.closest('button,.btn,.mini,.calcKey'))sfx()},{passive:true});render();startFocusTimer();startWatchTimer();
</script>
</body>
</html>
