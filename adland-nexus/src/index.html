<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AdLand Nexus</title>
<style>
:root{--a:#78f7d0;--bg:#071019;--p:#0b1720;--line:#ffffff12;--text:#edf7f5;--muted:#718990}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font:13px Segoe UI,Inter,Arial;color:var(--text);background:radial-gradient(circle at 85% 10%,#163c4f55,transparent 25%),radial-gradient(circle at 5% 100%,#17344555,transparent 30%),var(--bg)}
button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.app{height:100%;display:grid;grid-template-rows:62px 1fr}.top{display:flex;align-items:center;gap:15px;padding:0 15px;background:#061019ee;border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:9px;min-width:215px}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),#91a7ff);color:#061017;font-weight:900;box-shadow:0 0 28px #78f7d044}.brand b{display:block;font-size:11px;letter-spacing:.15em}.brand small{display:block;color:#668089;font-size:7px;letter-spacing:.18em;margin-top:3px}
.search{height:37px;flex:1;max-width:560px;border:1px solid var(--line);border-radius:11px;background:#ffffff05;color:#71878e;text-align:left;padding:0 11px;display:flex;align-items:center;gap:8px}.search span{flex:1}.search kbd{font-size:8px;border:1px solid var(--line);padding:4px 6px;border-radius:6px}
.wins{margin-left:auto;display:flex;gap:4px}.win{width:29px;height:29px;border-radius:8px;border:0;background:transparent;color:#71878e}.win:hover{background:#ffffff09;color:#fff}.close:hover{background:#a13240;color:#fff}
.shell{min-height:0;display:grid;grid-template-columns:215px 1fr}.side{padding:15px 10px;border-right:1px solid var(--line);background:#050d13cc;display:flex;flex-direction:column}.label{color:#526a73;font-size:8px;letter-spacing:.18em;padding:6px 9px}.nav{display:grid;gap:4px;margin-top:5px}.nav button{height:39px;border:0;border-radius:10px;background:transparent;text-align:left;color:#759099;padding:0 10px;display:flex;gap:9px;align-items:center}.nav button:hover{background:#ffffff06;color:#dff8f5}.nav button.active{background:#78f7d00e;box-shadow:inset 3px 0 var(--a);color:#edfffb}.badge{margin-left:auto;padding:3px 6px;border-radius:99px;border:1px solid var(--line);font-size:8px}.push{flex:1}.foot{color:#5d747d;font-size:8px;line-height:1.6;padding:8px 9px}.foot b{color:var(--a)}
.main{overflow:auto;padding:26px 28px 40px}.page{max-width:1180px;margin:auto}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:17px}.ey{color:#607980;font-size:8px;letter-spacing:.2em}.head h1{margin:5px 0 3px;font-size:26px;letter-spacing:-.04em}.head p{margin:0;color:#71878e;font-size:10px}.btn{height:35px;border:1px solid #78f7d033;background:#78f7d009;border-radius:10px;padding:0 12px;color:#c6fbf1;font-weight:700}.btn:hover{background:#78f7d015;border-color:#78f7d066}.primary{background:linear-gradient(135deg,#78f7d0,#91a7ff);border:0;color:#071018;box-shadow:0 12px 35px #78f7d020}
.card{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#ffffff08,#ffffff02);backdrop-filter:blur(12px);box-shadow:0 22px 65px #00000018}.hero{display:grid;grid-template-columns:1.35fr .65fr;gap:11px}.heroMain{padding:23px;min-height:220px;position:relative;overflow:hidden}.heroMain:after{content:"";position:absolute;width:310px;height:310px;border:1px solid #78f7d01d;border-radius:50%;right:-120px;top:-120px;box-shadow:0 0 90px #78f7d01a}.pill{display:inline-block;border:1px solid #78f7d044;border-radius:99px;padding:5px 9px;color:var(--a);font-size:8px;letter-spacing:.12em}.hero h2{font-size:34px;line-height:1.02;letter-spacing:-.06em;margin:16px 0 9px;max-width:570px}.hero h2 span{color:var(--a)}.hero p{max-width:560px;color:#72878f;line-height:1.7}.heroSide{padding:18px}.k{font-size:8px;color:#55717a;letter-spacing:.15em}.big{font-size:40px;font-weight:800;margin-top:11px}.bar{height:5px;background:#13232c;border-radius:99px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#91a7ff);border-radius:99px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:11px 0}.stat{padding:13px;display:flex;align-items:center;gap:9px}.ico{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;border:1px solid #78f7d020;background:#78f7d009;color:var(--a)}.stat b{font-size:18px;display:block}.stat small{font-size:7px;color:#627a83}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.panel{padding:15px}.panelHead{display:flex;justify-content:space-between;margin-bottom:6px}.panelHead b{font-size:11px}.panelHead small{color:#607780;font-size:8px}
.task{display:flex;align-items:center;gap:9px;padding:10px 0;border-top:1px solid var(--line)}.task:first-child{border-top:0}.check{width:17px;height:17px;border-radius:6px;border:1px solid #33505a;background:transparent}.check.on{background:var(--a);border-color:var(--a);color:#051016}.task main{flex:1}.task main b{font-size:9px;display:block}.task main small{font-size:7px;color:#617983;display:block;margin-top:3px}.task.done b{text-decoration:line-through;color:#61737b}.prio{font-size:7px;border:1px solid var(--line);border-radius:99px;padding:4px 6px;color:#92a4a8}
.field{width:100%;border:1px solid var(--line);background:#ffffff04;color:#edf7f5;border-radius:10px;padding:10px;outline:0}.field:focus{border-color:#78f7d055;box-shadow:0 0 0 3px #78f7d00a}.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.area{min-height:185px;resize:none}.actions{display:flex;gap:6px}.mini{height:28px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:#ffffff05;color:#9bb0b6;font-size:8px}.mini:hover{background:#ffffff0b;color:#fff}
.editor{display:grid;grid-template-columns:230px 1fr;gap:10px;min-height:555px}.list{padding:11px}.noteBtn{width:100%;border:0;text-align:left;background:transparent;color:#8fa5ab;border-radius:9px;padding:10px}.noteBtn:hover,.noteBtn.active{background:#ffffff07;color:#fff}.edit{padding:16px}.edit .title{font-size:18px;font-weight:800}
.dialWrap{min-height:545px;display:grid;place-items:center;text-align:center}.dial{width:285px;height:285px;border-radius:50%;background:conic-gradient(var(--a) var(--p),#12242e 0);display:grid;place-items:center;box-shadow:0 0 90px #78f7d018}.dial>div{width:250px;height:250px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 25%,#183b48,#08131c 64%);border:1px solid #ffffff12}.time{font-size:58px;font-weight:800;letter-spacing:-.07em}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tool{padding:17px;min-height:220px}.tool h3{margin:0;font-size:11px}.tool p{color:#6f858d;font-size:8px}.result{font-size:29px;font-weight:800;margin-top:10px}.facts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.fact{padding:9px;border:1px solid var(--line);border-radius:9px;background:#ffffff03}.fact b{font-size:8px}.fact p{margin:4px 0 0}
.settings{padding:16px}.setting{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--line)}.setting:first-child{border-top:0}.setting small{display:block;color:#647b83;font-size:8px;margin-top:4px}
.toast{position:fixed;left:18px;bottom:18px;opacity:0;transform:translateY(7px);transition:.2s;padding:10px 12px;border:1px solid #78f7d044;background:#10232ccc;border-radius:10px;color:#dff1ee;z-index:50}.toast.show{opacity:1;transform:none}
.palette{position:fixed;inset:0;display:none;place-items:start center;padding-top:115px;background:#0008;backdrop-filter:blur(7px);z-index:40}.palette.open{display:grid}.pal{width:min(610px,calc(100vw - 40px));border:1px solid #78f7d044;background:#0b1822;border-radius:15px;overflow:hidden;box-shadow:0 30px 100px #000d}.pal input{width:100%;padding:15px;border:0;border-bottom:1px solid var(--line);background:transparent;color:#fff;outline:0}.pal div{padding:11px 15px;border-bottom:1px solid #ffffff08;cursor:pointer}.pal div:hover{background:#78f7d00a}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.hero,.grid,.stats,.toolgrid,.editor{grid-template-columns:1fr}.main{padding:18px}.search,.controls .muted{display:none}}
</style></head><body>
<div class="app"><header class="top"><div class="brand"><div class="logo">AN</div><div><b>ADLAND NEXUS</b><small>BY ADLAND STUDIO</small></div></div><button class="search" id="search">⌕ <span>Search workspace</span><kbd>Ctrl ⇧ Space</kbd></button><div class="wins"><span class="muted" style="font-size:8px;align-self:center">LOCAL</span><button class="win" data-win="min">—</button><button class="win" data-win="max">□</button><button class="win close" data-win="close">×</button></div></header>
<div class="shell"><aside class="side"><div class="label">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="push"></div><div class="foot">One focused desktop workspace.<br><b>AdLand Studio</b> · local-first</div></aside><main class="main"><div class="page" id="view"></div></main></div></div>
<div class="toast" id="toast"></div><div class="palette" id="palette"><div class="pal"><input id="palInput" placeholder="Type a command…"><div id="palItems"></div></div></div>
<script>
const NAV=[['overview','⌂','Overview'],['tasks','✓','Tasks'],['notes','▤','Notes'],['snippets','<>','Snippets'],['focus','◷','Focus'],['tools','⚙','Toolkit'],['settings','◇','Settings']];
const DEF={page:'overview',tasks:[{id:1,title:'Build something worth keeping',project:'Nexus',p:'HIGH',done:false},{id:2,title:'Polish the release',project:'AdLand',p:'MID',done:true},{id:3,title:'Review tomorrow',project:'Personal',p:'LOW',done:false}],notes:[{id:1,title:'Nexus note',body:'Clarity is a feature. Keep the surface calm and the tools useful.',date:Date.now()}],snippets:[{id:1,title:'Git status',lang:'Shell',body:'git status\ngit diff --stat'}],activeNote:1,activeSnippet:1,accent:'#78f7d0',focus:1500,mode:'Focus',running:false};
let state;try{state=Object.assign({},DEF,JSON.parse(localStorage.getItem('adland-nexus')||'{}'))}catch(e){state=DEF}
let timer=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const save=()=>localStorage.setItem('adland-nexus',JSON.stringify(state));
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.classList.remove('show'),1500)}
function go(p){state.page=p;save();render()}
function taskRow(t){return '<div class="task '+(t.done?'done':'')+'"><button class="check '+(t.done?'on':'')+'" data-toggle="'+t.id+'">'+(t.done?'✓':'')+'</button><main><b>'+esc(t.title)+'</b><small>'+esc(t.project)+'</small></main><span class="prio">'+t.p+'</span><button class="mini" data-del="'+t.id+'">Delete</button></div>'}
function head(e,t,p,a){return '<div class="head"><div><div class="ey">'+e+'</div><h1>'+t+'</h1><p>'+p+'</p></div>'+(a||'')+'</div>'}
function overview(){const total=state.tasks.length,open=state.tasks.filter(t=>!t.done).length,p=total?Math.round((total-open)/total*100):0;return head('COMMAND CENTER','Your work, in focus.','Tasks, notes, snippets and deep work in one calm surface.','<button class="btn primary" data-go="tasks">+ New task</button>')+'<div class="hero"><section class="card heroMain"><span class="pill">ADLAND NEXUS · 01</span><h2>Make useful things.<br><span>Then make them delightful.</span></h2><p>Nexus keeps the everyday tools close, local and fast, with no account required for your workspace.</p></section><section class="card heroSide"><div class="k">COMPLETION</div><div class="big">'+p+'%</div><div class="muted" style="font-size:9px">'+(total-open)+' done · '+open+' open</div><div class="bar"><i style="width:'+p+'%"></i></div><div style="margin-top:26px;color:#607980;font-size:8px">SAVED AUTOMATICALLY</div></section></div><div class="stats"><div class="card stat"><div class="ico">✓</div><div><b>'+open+'</b><small>OPEN TASKS</small></div></div><div class="card stat"><div class="ico">▤</div><div><b>'+state.notes.length+'</b><small>NOTES</small></div></div><div class="card stat"><div class="ico">&lt;&gt;</div><div><b>'+state.snippets.length+'</b><small>SNIPPETS</small></div></div></div><div class="grid"><section class="card panel"><div class="panelHead"><b>Today’s queue</b><small>'+open+' open</small></div>'+state.tasks.slice(0,5).map(taskRow).join('')+'</section><section class="card panel"><div class="panelHead"><b>Nexus note</b><small>AdLand Studio</small></div><div style="font-size:19px;line-height:1.25;margin:10px 0">“Make useful things. Then make them delightful.”</div><div class="muted" style="font-size:9px;line-height:1.7">Export is always available in Settings. Your day-to-day data stays in local storage.</div></section></div>'}
function tasks(){return head('EXECUTION','Tasks','Turn the next thought into a finished thing.','<button class="btn primary" id="addTask">+ New task</button>')+'<section class="card panel"><div class="form"><input id="taskTitle" class="field" placeholder="What needs doing?"><div class="row2"><input id="taskProject" class="field" placeholder="Project"><select id="taskPrio" class="field"><option>HIGH</option><option selected>MID</option><option>LOW</option></select></div></div><div style="margin-top:13px">'+state.tasks.map(taskRow).join('')+'</div></section>'}
function notes(){const n=state.notes.find(x=>x.id===state.activeNote)||state.notes[0];return head('CAPTURE','Notes','Ideas should be easy to keep and easy to find.','<button class="btn primary" id="addNote">+ New note</button>')+'<div class="editor"><section class="card list">'+state.notes.map(x=>'<button class="noteBtn '+(n&&x.id===n.id?'active':'')+'" data-note="'+x.id+'"><b>'+esc(x.title)+'</b><small style="display:block;color:#617984;margin-top:3px">'+new Date(x.date).toLocaleDateString()+'</small></button>').join('')+'</section><section class="card edit">'+(n?'<input id="noteTitle" class="field title" value="'+esc(n.title)+'"><textarea id="noteBody" class="field area">'+esc(n.body)+'</textarea><div class="actions"><button class="btn primary" id="saveNote">Save note</button><button class="mini" id="delNote">Delete</button></div>':'<div class="muted">Create your first note.</div>')+'</section></div>'}
function snippets(){const s=state.snippets.find(x=>x.id===state.activeSnippet)||state.snippets[0];return head('REUSE','Snippets','Keep useful commands ready when you need them.','<button class="btn primary" id="addSnippet">+ New snippet</button>')+'<div class="editor"><section class="card list">'+state.snippets.map(x=>'<button class="noteBtn '+(s&&x.id===s.id?'active':'')+'" data-snip="'+x.id+'"><b>'+esc(x.title)+'</b><small style="display:block;color:#617984;margin-top:3px">'+esc(x.lang)+'</small></button>').join('')+'</section><section class="card edit">'+(s?'<input id="snTitle" class="field title" value="'+esc(s.title)+'"><input id="snLang" class="field" value="'+esc(s.lang)+'"><textarea id="snBody" class="field area">'+esc(s.body)+'</textarea><div class="actions"><button class="btn primary" id="saveSnip">Save snippet</button><button class="mini" id="copySnip">Copy</button><button class="mini" id="delSnip">Delete</button></div>':'<div class="muted">Create your first snippet.</div>')+'</section></div>'}
function fmt(s){return Math.floor(s/60).toString().padStart(2,'0')+':'+(s%60).toString().padStart(2,'0')}
function focus(){const max=state.mode==='Focus'?1500:300,p=Math.round(state.focus/max*100);return head('DEEP WORK','Focus','Protect one block of attention.','<button class="btn" id="resetFocus">Reset</button>')+'<section class="card panel dialWrap"><div><div class="k">'+state.mode.toUpperCase()+'</div><div class="dial" style="--p:'+p+'%"><div><div><div class="time" id="time">'+fmt(state.focus)+'</div><small>'+(state.running?'RUNNING':'READY')+'</small></div></div></div><div class="actions" style="justify-content:center;margin-top:15px"><button class="btn primary" id="toggleFocus">'+(state.running?'Pause':'Start')+'</button><button class="btn" id="mode">Switch to '+(state.mode==='Focus'?'5 min break':'25 min focus')+'</button></div></div></section>'}
function toolsPage(){return head('UTILITY','Toolkit','Small tools, close to the work.')+'<div class="toolgrid"><section class="card tool"><h3>Calculator</h3><p>Quick arithmetic without leaving the workspace.</p><input id="calc" class="field" placeholder="(128 * 4) / 2"><div class="result" id="result">—</div></section><section class="card tool"><h3>System snapshot</h3><p>Read-only details from your host machine.</p><div class="facts" id="facts">Loading…</div></section></div>'}
function settings(){return head('PREFERENCES','Settings','Tune the surface without touching the data.')+'<section class="card settings"><div class="setting"><div><b>Accent</b><small>Use your preferred highlight color.</small></div><input id="accent" type="color" value="'+state.accent+'"></div><div class="setting"><div><b>Export workspace</b><small>Create a JSON backup you control.</small></div><button class="mini" id="export">Export</button></div><div class="setting"><div><b>Import workspace</b><small>Restore a previous JSON backup.</small></div><label class="mini">Import<input id="import" type="file" accept="application/json" hidden></label></div><div class="setting"><div><b>Keyboard</b><small>Ctrl + Shift + Space opens command search.</small></div><span class="k">READY</span></div><div class="setting"><div><b>About</b><small>AdLand Nexus · version 1.0.0</small></div><b style="color:var(--a)">ADLAND STUDIO</b></div></section>'}
function render(){document.documentElement.style.setProperty('--a',state.accent);$('#nav').innerHTML=NAV.map(n=>'<button class="'+(state.page===n[0]?'active':'')+'" data-go="'+n[0]+'"><i>'+n[1]+'</i><span>'+n[2]+'</span>'+(n[0]==='tasks'?'<em class="badge">'+state.tasks.filter(t=>!t.done).length+'</em>':'')+'</button>').join('');$('#view').innerHTML=state.page==='overview'?overview():state.page==='tasks'?tasks():state.page==='notes'?notes():state.page==='snippets'?snippets():state.page==='focus'?focus():state.page==='tools'?toolsPage():settings();bind();if(state.page==='tools'&&window.nexus)window.nexus.system().then(x=>{$('#facts').innerHTML='<div class="fact"><b>Host</b><p>'+esc(x.host)+'</p></div><div class="fact"><b>CPU</b><p>'+esc(x.cpu)+'</p></div><div class="fact"><b>Cores</b><p>'+x.cores+'</p></div><div class="fact"><b>Memory</b><p>'+Math.round((x.total-x.free)/x.total*100)+'% used</p></div><div class="fact"><b>OS</b><p>'+esc(x.release)+'</p></div><div class="fact"><b>Arch</b><p>'+esc(x.arch)+'</p></div>'}).catch(()=>$('#facts').textContent='System data unavailable')}
function bind(){document.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(x.dataset.go));document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{const t=state.tasks.find(v=>v.id==x.dataset.toggle);if(t){t.done=!t.done;save();render()}});document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{state.tasks=state.tasks.filter(v=>v.id!=x.dataset.del);save();render()});document.querySelectorAll('[data-note]').forEach(x=>x.onclick=()=>{state.activeNote=+x.dataset.note;save();render()});document.querySelectorAll('[data-snip]').forEach(x=>x.onclick=()=>{state.activeSnippet=+x.dataset.snip;save();render()});
const at=$('#addTask');if(at)at.onclick=()=>{const title=$('#taskTitle').value.trim();if(!title)return toast('Write a task first');state.tasks.unshift({id:Date.now(),title,project:$('#taskProject').value.trim()||'General',p:$('#taskPrio').value,done:false});save();render();toast('Task added')};const an=$('#addNote');if(an)an.onclick=()=>{const n={id:Date.now(),title:'Untitled note',body:'',date:Date.now()};state.notes.unshift(n);state.activeNote=n.id;save();render()};const sn=$('#saveNote');if(sn)sn.onclick=()=>{const n=state.notes.find(x=>x.id===state.activeNote);if(n){n.title=$('#noteTitle').value;n.body=$('#noteBody').value;n.date=Date.now();save();render();toast('Note saved')}};const dn=$('#delNote');if(dn)dn.onclick=()=>{state.notes=state.notes.filter(x=>x.id!==state.activeNote);state.activeNote=state.notes[0]?.id||0;save();render()};
const asp=$('#addSnippet');if(asp)asp.onclick=()=>{const s={id:Date.now(),title:'Untitled snippet',lang:'Shell',body:''};state.snippets.unshift(s);state.activeSnippet=s.id;save();render()};const ss=$('#saveSnip');if(ss)ss.onclick=()=>{const s=state.snippets.find(x=>x.id===state.activeSnippet);if(s){s.title=$('#snTitle').value;s.lang=$('#snLang').value;s.body=$('#snBody').value;save();render();toast('Snippet saved')}};const cp=$('#copySnip');if(cp)cp.onclick=()=>{navigator.clipboard.writeText(state.snippets.find(x=>x.id===state.activeSnippet)?.body||'');toast('Copied')};const ds=$('#delSnip');if(ds)ds.onclick=()=>{state.snippets=state.snippets.filter(x=>x.id!==state.activeSnippet);state.activeSnippet=state.snippets[0]?.id||0;save();render()};
const c=$('#calc');if(c)c.oninput=()=>{try{if(!/^[0-9+\-*/().%\s]+$/.test(c.value))throw 0;$('#result').textContent=c.value?String(Function('"use strict";return ('+c.value+')')()):'—'}catch(e){$('#result').textContent='—'}};const tg=$('#toggleFocus');if(tg)tg.onclick=()=>{state.running=!state.running;save();render();startTimer()};const mm=$('#mode');if(mm)mm.onclick=()=>{state.mode=state.mode==='Focus'?'Break':'Focus';state.focus=state.mode==='Focus'?1500:300;state.running=false;save();render()};const rf=$('#resetFocus');if(rf)rf.onclick=()=>{state.focus=state.mode==='Focus'?1500:300;state.running=false;save();render()};const ac=$('#accent');if(ac)ac.oninput=()=>{state.accent=ac.value;save();document.documentElement.style.setProperty('--a',state.accent)};
const ex=$('#export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='adland-nexus-workspace.json';a.click();toast('Workspace exported')};const im=$('#import');if(im)im.onchange=async()=>{try{state=Object.assign({},DEF,JSON.parse(await im.files[0].text()));save();render();toast('Workspace imported')}catch(e){toast('Import failed')}}}
function startTimer(){clearInterval(timer);if(!state.running)return;timer=setInterval(()=>{if(state.focus>0){state.focus--;save();const x=$('#time');if(x)x.textContent=fmt(state.focus)}else{state.running=false;clearInterval(timer);save();toast('Focus complete');render()}},1000)}
function paletteOpen(){$('#palette').classList.add('open');$('#palInput').value='';$('#palInput').focus();paletteDraw('')}function paletteClose(){$('#palette').classList.remove('open')}function paletteDraw(q){const a=NAV.filter(n=>(n[0]+' '+n[2]).toLowerCase().includes(q.toLowerCase()));$('#palItems').innerHTML=a.map(n=>'<div data-pal="'+n[0]+'">'+n[2]+'</div>').join('')||'<div>No command</div>';document.querySelectorAll('[data-pal]').forEach(x=>x.onclick=()=>{go(x.dataset.pal);paletteClose()})}
$('#search').onclick=paletteOpen;$('#palette').onclick=e=>{if(e.target.id==='palette')paletteClose()};$('#palInput').oninput=e=>paletteDraw(e.target.value);document.querySelectorAll('[data-win]').forEach(x=>x.onclick=()=>window.nexus&&window.nexus.window(x.dataset.win));document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.code==='Space'){e.preventDefault();paletteOpen()}if(e.key==='Escape')paletteClose()});window.nexus?.onPalette(paletteOpen);render();startTimer();
</script></body></html>
