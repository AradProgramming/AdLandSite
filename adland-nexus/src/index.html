function syncPlayer(){const p=$('player'),x=store.tracks[store.trackIndex];if($('nowName'))$('nowName').textContent=x?x.name:'—';if($('playBtn'))$('playBtn').textContent=p.src&&!p.paused?'Ⅱ '+tr('pauseAudio'):'▶ '+tr('play');if($('volume'))$('volume').value=store.volume}
async function nextTrack(){if(!store.tracks.length)return;let i=store.trackIndex<0?0:store.trackIndex+1;if(store.shuffle)i=Math.floor(Math.random()*store.tracks.length);if(i>=store.tracks.length)i=0;await playTrack(i)}
function startAmbient(type){stopAmbient();store.ambient=type;if(type==='off'){save();render();return}try{audioCtx=audioCtx||(window.AudioContext?new AudioContext():new webkitAudioContext());if(audioCtx.state==='suspended')audioCtx.resume();const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;const src=audioCtx.createBufferSource(),filter=audioCtx.createBiquadFilter(),gain=audioCtx.createGain();src.buffer=buffer;src.loop=true;filter.type='lowpass';filter.frequency.value=type==='rain'?1800:type==='ocean'?900:type==='wind'?700:type==='fire'?3200:700;filter.Q.value=type==='ocean'?0.7:0.2;gain.gain.value=type==='brown'?.035:type==='fire'?.017:.022;if(type==='ocean'){const lfo=audioCtx.createOscillator(),lg=audioCtx.createGain();lfo.frequency.value=.08;lg.gain.value=.012;lfo.connect(lg).connect(gain);lfo.start();ambientNode={src,lfo}}else ambientNode={src};src.connect(filter).connect(gain).connect(audioCtx.destination);src.start();save();render()}catch(e){toast(tr('loadError'));tone('error')}}
function stopAmbient(){try{ambientNode?.src?.stop()}catch(e){}try{ambientNode?.lfo?.stop()}catch(e){}ambientNode=null;ambientGain=null}
function relax(){
 const cards=[['off','◼'],['rain','🌧'],['brown','◌'],['ocean','≈'],['wind','⌁'],['fire','♨']];
 const tracks=store.tracks.length?store.tracks.map((x,i)=>'<div class="track '+(i===store.trackIndex?'active':'')+'" data-track="'+i+'"><div class="album">♫</div><div style="flex:1;min-width:0"><b>'+esc(x.name)+'</b><small>'+Math.round((x.size||0)/1048576*10)/10+' MB</small></div></div>').join(''):'<div style="font-size:8px;color:#6f858d;padding:12px 0">'+tr('noTracks')+'</div>';
 const ambient=cards.map(a=>'<div class="soundCard '+(store.ambient===a[0]?'active':'')+'" data-ambient="'+a[0]+'"><b>'+a[1]+' '+tr(a[0])+'</b><small>'+tr(a[0]+'Desc')+'</small></div>').join('');
 return head(tr('relaxTitle'),tr('relaxTitle'),tr('relaxDesc'))+
 '<div class="relax"><section class="card ambient"><div class="ey">'+tr('ambient')+'</div><div class="ambientWave"></div><div class="soundGrid">'+ambient+'</div></section>'+
 '<section class="card musicPanel"><div class="panelHead"><div><b>'+tr('music')+'</b><small style="display:block;color:#607982;margin-top:4px">'+tr('musicDesc')+'</small></div><button class="btn primary" id="addTracks">'+tr('addTracks')+'</button></div>'+
 '<div class="trackList">'+tracks+'</div><div style="margin-top:12px;font-size:7px;color:#607982">'+tr('nowPlaying')+': <span id="nowName">—</span></div>'+
 '<div class="playerBtns"><button class="mini" id="prev">◀ '+tr('prev')+'</button><button class="btn primary" id="playBtn">▶ '+tr('play')+'</button><button class="mini" id="next">'+tr('next')+' ▶</button><button class="mini" id="shuffle">'+tr('shuffle')+'</button></div>'+
 '<div style="display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:center;margin-top:11px"><input id="volume" class="range" type="range" min="0" max="1" step=".01" value="'+store.volume+'"><span style="font-size:8px;color:#6d838b">'+tr('volume')+'</span></div></section></div>';
}
function settings(){return head(tr('preferences'),tr('settings'),tr('tune'))+'<section class="card settingsCard"><div class="setting"><div class="settingText"><b>'+tr('language')+'</b><small>'+tr('languageDesc')+'</small></div><div class="settingControl"><select id="language" class="field select"><option value="en" '+(store.lang==='en'?'selected':'')+'>'+tr('english')+'</option><option value="fa" '+(store.lang==='fa'?'selected':'')+'>'+tr('persian')+'</option></select></div></div><div class="setting"><div class="settingText"><b>'+tr('theme')+'</b><small>'+tr('themeDesc')+'</small></div><div class="vibeRow">'+Object.keys(VIBES).map(k=>'<button class="vibe '+(store.theme===k?'active':'')+'" data-theme="'+k+'">● '+k+'</button>').join('')+'</div></div><div class="setting"><div class="settingText"><b>'+tr('accent')+'</b><small>'+tr('accentDesc')+'</small></div><input id="accent" class="field" type="color" value="'+esc(store.accent)+'" style="width:48px;padding:4px"></div><div class="setting"><div class="settingText"><b>'+tr('focusDefault')+'</b><small>5–120 '+tr('minutes')+'</small></div><input id="focusRange" class="range" type="range" min="5" max="120" step="5" value="'+store.defaultFocus+'"></div><div class="setting"><div class="settingText"><b>'+tr('breakTime')+'</b><small>1–30 '+tr('minutes')+'</small></div><input id="breakRange" class="range" type="range" min="1" max="30" value="'+store.defaultBreak+'"></div><div class="setting"><div class="settingText"><b>'+tr('sound')+'</b><small>'+tr('soundDesc')+'</small></div><button class="toggle '+(store.soundOn?'on':'')+'" id="soundToggle"><i></i></button></div><div class="setting"><div class="settingText"><b>'+tr('autoBreak')+'</b><small>'+tr('autoBreakDesc')+'</small></div><button class="toggle '+(store.autoBreak?'on':'')+'" id="autoBreak"><i></i></button></div><div class="setting"><div class="settingText"><b>'+tr('animations')+'</b><small>'+tr('animationsDesc')+'</small></div><button class="toggle '+(store.reduced?'on':'')+'" id="reduced"><i></i></button></div><div class="setting"><div class="settingText"><b>'+tr('export')+'</b><small>'+tr('exportDesc')+'</small></div><button class="mini" id="export">'+tr('export')+'</button></div><div class="setting"><div class="settingText"><b>'+tr('import')+'</b><small>'+tr('importDesc')+'</small></div><label class="mini">'+tr('import')+'<input id="import" type="file" accept="application/json" hidden></label></div><div class="setting"><div class="settingText"><b>'+tr('about')+'</b><small>'+tr('version')+' · '+tr('by')+'</small></div><div class="actions"><a class="mini" href="https://aradprogramming.github.io/AdLandSite/nexus/" target="_blank" rel="noopener">'+tr('site')+'</a><a class="mini" href="https://aradprogramming.github.io/AdLandSite/" target="_blank" rel="noopener">AdLand Studio</a></div></div></section>'}
function render(){apply();const v=$('view');v.innerHTML=store.page==='overview'?overview():store.page==='tasks'?tasks():store.page==='notes'?notes():store.page==='snippets'?snippets():store.page==='board'?board():store.page==='focus'?focus():store.page==='relax'?relax():store.page==='tools'?tools():settings();renderNav();bind();if(store.page==='tools'&&window.nexus)window.nexus.system().then(x=>{$('facts').innerHTML='<div class="fact"><b>Host</b><p>'+esc(x.host)+'</p></div><div class="fact"><b>CPU</b><p>'+esc(x.cpu)+'</p></div><div class="fact"><b>Cores</b><p>'+x.cores+'</p></div><div class="fact"><b>Memory</b><p>'+Math.round((x.total-x.free)/x.total*100)+'% used</p></div><div class="fact"><b>OS</b><p>'+esc(x.release)+'</p></div><div class="fact"><b>Architecture</b><p>'+esc(x.arch)+'</p></div>'}).catch(()=>{});if(store.page==='relax')syncPlayer()}
function renderNav(){$('nav').innerHTML=NAV.map(n=>'<button class="'+(store.page===n.id?'active':'')+'" data-go="'+n.id+'"><i>'+n.icon+'</i><span>'+tr(n.id)+'</span>'+(n.id==='tasks'?'<em class="badge">'+store.tasks.filter(x=>!x.done).length+'</em>':'')+'</button>').join('')}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{store.page=b.dataset.go;save();tone('nav');render()});
 document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const t=store.tasks.find(x=>x.id==b.dataset.toggle);if(t){t.done=!t.done;save();tone('success');render()}});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{store.tasks=store.tasks.filter(x=>x.id!=b.dataset.del);save();tone();render()});
 document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{store.activeNote=+b.dataset.note;save();tone('nav');render()});
 document.querySelectorAll('[data-snip]').forEach(b=>b.onclick=()=>{store.activeSnippet=+b.dataset.snip;save();tone('nav');render()});
 document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{const t=store.tasks.find(x=>x.id==b.dataset.move);if(!t)return;const order=['backlog','doing','done'];const st=t.status||(t.done?'done':'backlog');const ni=Math.max(0,Math.min(2,order.indexOf(st)+(Number(b.dataset.dir)||0)));t.status=order[ni];t.done=t.status==='done';save();tone('success');render()});
 const at=$('addTask');if(at)at.onclick=()=>{const title=$('taskTitle')?.value.trim();if(!title)return toast(tr('writeTask'));store.tasks.unshift({id:Date.now(),title,project:$('taskProject')?.value.trim()||'General',p:$('taskPrio')?.value||'MID',done:false});save();tone('success');render();toast(tr('taskAdded'))};
 const an=$('addNote');if(an)an.onclick=()=>{const n={id:Date.now(),title:tr('capture'),body:'',date:Date.now()};store.notes.unshift(n);store.activeNote=n.id;save();tone('success');render()};
 const sn=$('saveNote');if(sn)sn.onclick=()=>{const n=store.notes.find(x=>x.id===store.activeNote);if(n){n.title=$('noteTitle').value;n.body=$('noteBody').value;n.date=Date.now();save();render();toast(tr('saved'))}};
 const dn=$('delNote');if(dn)dn.onclick=()=>{store.notes=store.notes.filter(x=>x.id!==store.activeNote);store.activeNote=store.notes[0]?.id||0;save();render()};
 const as=$('addSnippet');if(as)as.onclick=()=>{const q={id:Date.now(),title:'Untitled snippet',lang:'Shell',body:''};store.snippets.unshift(q);store.activeSnippet=q.id;save();render()};
 const ss=$('saveSnip');if(ss)ss.onclick=()=>{const q=store.snippets.find(x=>x.id===store.activeSnippet);if(q){q.title=$('snTitle').value;q.lang=$('snLang').value;q.body=$('snBody').value;save();render();toast(tr('saved'))}};
 const cs=$('copySnip');if(cs)cs.onclick=()=>navigator.clipboard.writeText(store.snippets.find(x=>x.id===store.activeSnippet)?.body||'').then(()=>toast(tr('copied')));
 const ds=$('delSnip');if(ds)ds.onclick=()=>{store.snippets=store.snippets.filter(x=>x.id!==store.activeSnippet);store.activeSnippet=store.snippets[0]?.id||0;save();render()};
 document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{store.defaultFocus=+b.dataset.preset;store.focusMode='Focus';store.focusSec=store.defaultFocus*60;store.focusRunning=false;save();render()});
 const ft=$('toggleFocus');if(ft)ft.onclick=()=>{store.focusRunning=!store.focusRunning;save();tone('success');render();startFocus()};
 const mode=$('mode');if(mode)mode.onclick=()=>{store.focusMode=store.focusMode==='Focus'?'Break':'Focus';store.focusSec=(store.focusMode==='Focus'?store.defaultFocus:store.defaultBreak)*60;store.focusRunning=false;save();render()};
 const rf=$('resetFocus');if(rf)rf.onclick=()=>{store.focusSec=(store.focusMode==='Focus'?store.defaultFocus:store.defaultBreak)*60;store.focusRunning=false;save();render()};
 const cp=$('customPreset');if(cp)cp.onclick=()=>{const n=Number(prompt('Focus length / دقیقه',String(store.defaultFocus)));if(Number.isFinite(n)&&n>=5&&n<=120){store.defaultFocus=Math.round(n);store.focusSec=store.defaultFocus*60;save();render()}};
 document.querySelectorAll('[data-calc]').forEach(b=>b.onclick=()=>calcPress(b.dataset.calc));
 document.querySelectorAll('[data-history]').forEach(b=>b.onclick=()=>{store.calcExpr=store.calcHistory[+b.dataset.history]?.expr||'';save();calcRender()});
 const ch=$('clearHistory');if(ch)ch.onclick=()=>{store.calcHistory=[];save();calcRender()};
 const ug=$('uuidGen');if(ug)ug.onclick=()=>{$('uuidOut').textContent=crypto.randomUUID();tone('success')};
 const uc=$('uuidCopy');if(uc)uc.onclick=()=>navigator.clipboard.writeText($('uuidOut').textContent).then(()=>toast(tr('copied')));
 const sc=$('stampCopy');if(sc)sc.onclick=()=>navigator.clipboard.writeText($('stampOut').textContent).then(()=>toast(tr('copied')));
 const wt=$('watchToggle');if(wt)wt.onclick=()=>{store.watchRunning=!store.watchRunning;save();tone();render();startWatch()};
 const wr=$('watchReset');if(wr)wr.onclick=()=>{store.stopwatch=0;store.watchRunning=false;save();render()};
 const language=$('language');if(language)language.onchange=()=>{store.lang=language.value;save();render()};
 const accent=$('accent');if(accent)accent.oninput=()=>{store.accent=accent.value;save();apply()};
 document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{store.theme=b.dataset.theme;store.accent=VIBES[store.theme][0];save();tone('success');render()});
 const sound=$('soundToggle');if(sound)sound.onclick=()=>{store.soundOn=!store.soundOn;save();render();if(store.soundOn)tone('success')};
 const auto=$('autoBreak');if(auto)auto.onclick=()=>{store.autoBreak=!store.autoBreak;save();render()}; const reduced=$('reduced');if(reduced)reduced.onclick=()=>{store.reduced=!store.reduced;save();render()};
 const fr=$('focusRange');if(fr)fr.oninput=()=>{store.defaultFocus=+fr.value;save()};
 const br=$('breakRange');if(br)br.oninput=()=>{store.defaultBreak=+br.value;save()};
 const ex=$('export');if(ex)ex.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(store,null,2)],{type:'application/json'}));a.download='adland-nexus-workspace.json';a.click();toast(tr('export'))};
 const im=$('import');if(im)im.onchange=async()=>{try{store=Object.assign({},base,JSON.parse(await im.files[0].text()));save();render();toast(tr('imported'))}catch(e){toast(tr('importFailed'))}};
 const add=$('addTracks');if(add)add.onclick=addTracks;
 document.querySelectorAll('[data-ambient]').forEach(b=>b.onclick=()=>startAmbient(b.dataset.ambient));
 document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>playTrack(+b.dataset.track));
 const pp=$('playBtn');if(pp)pp.onclick=async()=>{const p=$('player');if(!p.src&&store.trackIndex>=0){await playTrack(store.trackIndex)}else if(p.paused){try{await p.play();tone()}catch(e){if(store.trackIndex>=0)await playTrack(store.trackIndex)}}else{p.pause();tone()}syncPlayer()};
 const pv=$('prev');if(pv)pv.onclick=async()=>playTrack(store.trackIndex<=0?store.tracks.length-1:store.trackIndex-1);
 const nx=$('next');if(nx)nx.onclick=nextTrack;
 const sh=$('shuffle');if(sh)sh.onclick=()=>{store.shuffle=!store.shuffle;save();sh.classList.toggle('active',store.shuffle);tone('nav')};
 const vol=$('volume');if(vol)vol.oninput=()=>{store.volume=+vol.value;$('player').volume=store.volume;save()};
}
function startFocus(){clearInterval(timer);if(!store.focusRunning)return;timer=setInterval(()=>{if(store.focusSec>0){store.focusSec--;const x=$('time');if(x)x.textContent=fmt(store.focusSec);save()}else{clearInterval(timer);store.focusRunning=false;tone('success');if(store.focusMode==='Focus'&&store.autoBreak){store.focusMode='Break';store.focusSec=store.defaultBreak*60;store.focusRunning=true;render();startFocus()}else{render()}}},1000)}
function startWatch(){clearInterval(watchTimer);if(!store.watchRunning)return;watchTimer=setInterval(()=>{store.stopwatch+=.1;const x=$('watch');if(x)x.textContent=(Math.floor(store.stopwatch/60)).toString().padStart(2,'0')+':'+(Math.floor(store.stopwatch)%60).toString().padStart(2,'0')+'.'+Math.floor((store.stopwatch%1)*10);save()},100)}
function openPalette(){const p=$('palette');p.classList.add('open');$('palInput').value='';$('palInput').placeholder=tr('search');paletteDraw('');$('palInput').focus()}function closePalette(){$('palette').classList.remove('open')}function paletteDraw(q){const arr=NAV.filter(n=>(n.id+' '+tr(n.id)).toLowerCase().includes(q.toLowerCase()));$('palItems').innerHTML=arr.map(n=>'<div class="palitem" data-pal="'+n.id+'">'+n.icon+' &nbsp; '+tr(n.id)+'</div>').join('');document.querySelectorAll('[data-pal]').forEach(x=>x.onclick=()=>{store.page=x.dataset.pal;save();closePalette();render()})}
$('search').onclick=openPalette;$('palette').onclick=e=>{if(e.target.id==='palette')closePalette()};$('palInput').oninput=e=>paletteDraw(e.target.value);document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>window.nexus.window(b.dataset.win));document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.code==='Space'){e.preventDefault();openPalette()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&!e.shiftKey){e.preventDefault();store.page='notes';save();render()}if(e.key==='Escape')closePalette()});$('player').addEventListener('ended',()=>nextTrack());window.nexus?.onPalette(openPalette);render();
</script></body></html>
