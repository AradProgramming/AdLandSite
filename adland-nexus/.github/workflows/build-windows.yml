name: Build AdLand Nexus for Windows
on:
  push:
    branches: ["release"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: adland-nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: AdLand Nexus v1.0.0
          body: |
            AdLand Nexus v1.0.0 — desktop command center by AdLand Studio.
            
            Windows x64 installer and portable build are attached.
          files: |
            adland-nexus/release/AdLand-Nexus-1.0.0-Setup.exe
            adland-nexus/release/AdLand-Nexus-1.0.0-Portable.exe
          draft: false
          prerelease: false