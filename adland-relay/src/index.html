<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relay</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--a:#8ff9dc;--b:#6f8fff;--bg:#07090d;--panel:#0d1219;--line:#ffffff11;--text:#eef6f3;--muted:#708089}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Sora,Vazirmatn,sans-serif;background:radial-gradient(circle at 80% 5%,#8ff9dc14,transparent 28%),radial-gradient(circle at 10% 90%,#6f8fff10,transparent 25%),var(--bg);color:var(--text)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:66px 1fr}.top{display:flex;align-items:center;gap:12px;padding:0 15px;border-bottom:1px solid var(--line);background:#07090de8;backdrop-filter:blur(20px)}.brand{display:flex;align-items:center;gap:10px;min-width:220px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#071013;display:grid;place-items:center;font:900 11px Sora;box-shadow:0 0 36px #8ff9dc22}.brand b{display:block;font:800 11px Sora;letter-spacing:.15em}.brand small{display:block;margin-top:3px;color:#5f7078;font-size:6px;letter-spacing:.15em}.status{color:var(--a);font-size:6px;border:1px solid #8ff9dc22;padding:5px 8px;border-radius:99px}.tools{margin-left:auto;display:flex;gap:5px}.win{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:#708089}.win:hover{background:#ffffff08;color:#fff}.close:hover{background:#a53d4c;color:#fff}.main{display:grid;grid-template-columns:260px 1fr;min-height:0}.side{padding:15px 11px;border-right:1px solid var(--line);background:#05080cd8;display:flex;flex-direction:column;gap:9px}.label{font-size:7px;color:#50616b;letter-spacing:.2em;padding:3px 8px}.nav{display:grid;gap:5px}.nav button{height:42px;border:1px solid transparent;border-radius:10px;background:transparent;text-align:left;padding:0 10px;color:#72828a;font-size:9px}.nav button:hover,.nav button.active{background:#8ff9dc08;color:#e7f5f1;border-color:#8ff9dc1e;transform:translateX(2px)}.push{flex:1}.foot{font-size:7px;color:#586870;line-height:1.7}.foot b{color:var(--a)}.content{overflow:auto;padding:25px}.page{max-width:1180px;margin:auto}.ey{font:800 7px Sora;letter-spacing:.2em;color:#7f929a}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.head h1{font-size:30px;letter-spacing:-.06em;margin:7px 0 4px}.head p{font-size:9px;color:#70818a}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#ffffff08,#ffffff02);box-shadow:0 24px 90px #0008}.hero{padding:21px;display:grid;grid-template-columns:1fr .75fr;gap:10px}.paste{min-height:360px;padding:18px}.pasteTop{display:flex;justify-content:space-between;align-items:center}.pasteTop b{font-size:9px}.counter{color:#64767e;font-size:7px}.clip{margin-top:12px;min-height:210px;width:100%;padding:15px;border:1px solid #ffffff0d;border-radius:13px;background:#0002;color:#dbe8e4;resize:none;outline:0;font:11px/1.8 Sora,Vazirmatn}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{height:37px;padding:0 12px;border-radius:9px;border:1px solid #8ff9dc33;background:#8ff9dc08;color:var(--a);font:800 7px Sora}.primary{background:linear-gradient(135deg,var(--a),var(--b));color:#061014;border:0}.history{padding:16px}.historyHead{display:flex;justify-content:space-between;align-items:center}.historyHead b{font-size:9px}.historyList{display:grid;gap:6px;margin-top:10px;max-height:450px;overflow:auto}.item{padding:11px;border:1px solid #ffffff0b;border-radius:11px;background:#ffffff03;transition:.2s}.item:hover{border-color:#8ff9dc33;transform:translateX(-2px)}.itemTop{display:flex;justify-content:space-between;gap:8px}.item small{color:#607179;font-size:6px}.item p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0 0;color:#9aabb0;font-size:8px}.itemActions{display:flex;gap:4px;margin-top:7px}.tiny{height:27px;padding:0 8px;border:1px solid #ffffff0d;background:#ffffff03;color:#83929a;border-radius:7px;font-size:6px}.tiny:hover{border-color:#8ff9dc2e;color:#fff}.empty{padding:45px;text-align:center;color:#55676e;font-size:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{padding:12px}.stat b{display:block;font-size:18px}.stat small{color:#62737b;font-size:6px}@media(max-width:900px){.main{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}}@media(max-width:600px){.content{padding:13px}.stats{grid-template-columns:1fr}.hero{padding:12px}.head{display:block}.tools .status{display:none}}

</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">RE</div><div><b>RELAY</b><small>CLIPBOARD COMMAND CENTER</small></div></div><span class="status">● LOCAL / READY</span><div class="tools"><button class="win" onclick="window.relay.window.min()">—</button><button class="win" onclick="window.relay.window.max()">□</button><button class="win close" onclick="window.relay.window.close()">×</button></div></header><div class="main"><aside class="side"><span class="label">RELAY</span><div class="nav"><button class="active">◈ Clipboard</button><button onclick="focusSearch()">⌕ Search</button><button onclick="clearAll()">⌫ Clear history</button></div><div class="push"></div><div class="foot"><b>LOCAL-FIRST</b><br>Your clipboard history stays on this device.</div></aside><main class="content"><div class="page"><div class="head"><div><div class="ey">CLIPBOARD / MEMORY / FLOW</div><h1>Catch it once. Keep it useful.</h1><p>Fast local clipboard history with pinning, search and quick copy.</p></div></div><section class="hero"><div class="paste card"><div class="pasteTop"><b>QUICK CLIP</b><span class="counter" id="counter">0 ITEMS</span></div><textarea class="clip" id="clip" placeholder="Write or paste something here…"></textarea><div class="actions"><button class="btn primary" id="copyBtn">COPY TO CLIPBOARD</button><button class="btn" id="saveBtn">SAVE SNAPSHOT</button></div><div class="stats"><div class="stat card"><b id="total">0</b><small>HISTORY</small></div><div class="stat card"><b id="pins">0</b><small>PINNED</small></div><div class="stat card"><b id="chars">0</b><small>CHARACTERS</small></div></div></div><div class="history card"><div class="historyHead"><b>RECENT MEMORY</b><button class="tiny" onclick="clearAll()">CLEAR</button></div><div class="historyList" id="list"></div></div></section></div></main></div></div><script>
const KEY='relay-history-v1';let state=JSON.parse(localStorage.getItem(KEY)||'[]'),lastClip='';const $=s=>document.querySelector(s);function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function add(text,pinned=false){text=String(text||'').trim();if(!text)return;const old=state.find(x=>x.text===text);if(old){old.time=Date.now();old.pinned=old.pinned||pinned}else state.unshift({id:crypto.randomUUID(),text,time:Date.now(),pinned});state=state.slice(0,80);save()}function render(){const q=window.searchQ||'';const arr=state.filter(x=>!q||x.text.toLowerCase().includes(q.toLowerCase()));$('#list').innerHTML=arr.length?arr.map(x=>'<div class="item"><div class="itemTop"><small>'+new Date(x.time).toLocaleTimeString()+'</small><small>'+ (x.pinned?'PINNED':'')+'</small></div><p>'+esc(x.text)+'</p><div class="itemActions"><button class="tiny" onclick="copyItem(\''+x.id+'\')">COPY</button><button class="tiny" onclick="togglePin(\''+x.id+'\')">'+(x.pinned?'UNPIN':'PIN')+'</button><button class="tiny" onclick="delItem(\''+x.id+'\')">DELETE</button></div></div>').join(''):'<div class="empty">No clipboard memory yet.</div>';$('#total').textContent=state.length;$('#pins').textContent=state.filter(x=>x.pinned).length;$('#chars').textContent=state.reduce((a,x)=>a+x.text.length,0).toLocaleString();$('#counter').textContent=state.length+' ITEMS'}async function copyItem(id){const x=state.find(a=>a.id===id);if(x){await window.relay.clipboard.write(x.text);tone(1)}}function togglePin(id){const x=state.find(a=>a.id===id);if(x){x.pinned=!x.pinned;save();tone(2)}}function delItem(id){state=state.filter(x=>x.id!==id);save();tone(3)}function clearAll(){state=state.filter(x=>x.pinned);save();tone(3)}function focusSearch(){const q=prompt('Search clipboard');window.searchQ=q||'';render()}$('#copyBtn').onclick=async()=>{await window.relay.clipboard.write($('#clip').value);add($('#clip').value);tone(1)};$('#saveBtn').onclick=()=>add($('#clip').value);async function poll(){try{const x=await window.relay.clipboard.read();if(x&&x!==lastClip){lastClip=x;add(x);}}catch(e){}}setInterval(poll,900);poll();let s=localStorage.getItem('relay-sfx')!=='off';function tone(k=0){if(!s)return;try{const A=window.__a||(window.__a=new(window.AudioContext||window.webkitAudioContext)());if(A.state==='suspended')A.resume();const o=A.createOscillator(),g=A.createGain(),n=A.currentTime;let f=[350,520,680,240][k%4];o.type=k===2?'triangle':'sine';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.3,n+.06);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.012,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.09);o.connect(g).connect(A.destination);o.start(n);o.stop(n+.1)}catch(e){}}document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>tone(0),{passive:true}));
</script></body></html>
