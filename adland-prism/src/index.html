<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism</title><style>
:root{--a:#7bf6df;--b:#ff7ad9;--bg:#080a10;--line:#ffffff12;--text:#f2f6fa;--muted:#77838e}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:"Segoe UI Variable","Segoe UI",Inter,sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,#7bf6df0d,transparent 25%),radial-gradient(circle at 85% 90%,#ff7ad90b,transparent 25%),var(--bg)}button,input{font:inherit;color:inherit}button{cursor:pointer}.app{height:100%;display:grid;grid-template-rows:66px 1fr}.top{display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--line);background:#080a10e8;backdrop-filter:blur(22px)}.brand{display:flex;align-items:center;gap:10px}.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));color:#080a10;display:grid;place-items:center;font:950 11px Inter}.brand b{font-size:11px;letter-spacing:.18em}.brand small{display:block;color:#65727c;font-size:6px;letter-spacing:.15em;margin-top:3px}.tools{margin-left:auto;display:flex;gap:5px}.win{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:#7d8993}.win:hover{background:#fff1;color:#fff}.close:hover{background:#a63b4c;color:#fff}.main{padding:22px;overflow:auto}.wrap{max-width:1180px;margin:auto}.hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:11px}.card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#ffffff07,#ffffff02);box-shadow:0 30px 90px #0008;backdrop-filter:blur(15px)}.controls{padding:22px}.ey{color:var(--a);font:800 7px Inter;letter-spacing:.18em}.controls h1{font-size:34px;letter-spacing:-.06em;margin:10px 0}.controls p{color:var(--muted);font-size:9px;line-height:1.8}.field{display:flex;gap:7px;margin-top:13px}.field input{flex:1;height:43px;border:1px solid #ffffff12;border-radius:10px;background:#ffffff04;padding:0 11px;outline:0;font:900 15px Inter}.field button{height:43px;padding:0 13px;border:0;border-radius:10px;background:linear-gradient(135deg,var(--a),#6cc6ff);color:#071014;font-weight:900}.ratio{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:11px;display:flex;justify-content:space-between;color:#93a0a9;font-size:8px}.ratio b{color:#fff;font:900 14px Inter}.preview{padding:14px;display:grid;gap:10px}.colorTile{height:300px;border-radius:15px;background:#7bf6df;box-shadow:inset 0 0 0 1px #fff2,0 25px 80px #0008;transition:.4s}.hexLine{display:flex;justify-content:space-between;align-items:center;color:#7e8c96;font-size:8px}.hexLine b{font:900 13px Inter;color:#fff}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.sw{height:55px;border-radius:9px;border:1px solid #fff2;cursor:pointer;transition:.2s}.sw:hover{transform:translateY(-3px);border-color:#fff}.gradient{height:70px;border-radius:12px;margin-top:10px;background:linear-gradient(110deg,#7bf6df,#8aa8ff,#ff7ad9)}.section{margin-top:11px;padding:17px}.section h2{font-size:17px;margin:0}.toolsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.tool{padding:12px;border:1px solid var(--line);border-radius:11px;background:#ffffff03}.tool small{display:block;color:#66747e;font-size:6px}.tool b{display:block;margin-top:6px;font:900 10px Inter}.tool button{margin-top:7px;height:28px;padding:0 8px;border:1px solid #7bf6df33;border-radius:7px;background:#7bf6df08;color:#7bf6df;font-size:6px}@media(max-width:850px){.hero{grid-template-columns:1fr}.toolsGrid{grid-template-columns:1fr 1fr}}@media(max-width:580px){.main{padding:13px}.palette{grid-template-columns:repeat(3,1fr)}.toolsGrid{grid-template-columns:1fr}}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 15% 15%,#7bf6df0c,transparent 24%),radial-gradient(circle at 88% 88%,#ff7ad90b,transparent 25%);animation:ambient 11s ease-in-out infinite}.soundBtn{height:30px;padding:0 9px;border:1px solid #7bf6df2e;border-radius:8px;background:#ffffff04;color:#7bf6df;font:800 6px "Plus Jakarta Sans";cursor:pointer}.app{position:relative;z-index:1}@keyframes ambient{50%{transform:scale(1.035)}}</style></head><body><div class="ambient"></div><div class="app"><header class="top"><div class="brand"><div class="logo">PX</div><div><b>PRISM</b><small>COLOR INTELLIGENCE LAB</small></div></div><div class="tools"><button class="win" data-win="min">—</button><button class="win" data-win="max">□</button><button class="win close" data-win="close">×</button></div></header><main class="main"><div class="wrap"><div class="hero"><section class="card controls"><div class="ey">PRISM / COLOR CORE</div><h1>Color, without the guesswork.</h1><p>Build palettes, check contrast and shape gradients in a focused local workspace.</p><div class="field"><input id="hex" value="#7BF6DF" maxlength="7"><button id="apply">APPLY</button></div><div class="ratio"><span>CONTRAST ON WHITE</span><b id="ratio">—</b></div><div class="ratio"><span>CONTRAST ON BLACK</span><b id="ratio2">—</b></div><div class="actions" style="display:flex;gap:6px;margin-top:12px"><button class="tool button" id="random">RANDOM COLOR</button><button class="tool button" id="copy">COPY HEX</button></div></section><section class="card preview"><div class="colorTile" id="tile"></div><div class="hexLine"><span>ACTIVE COLOR</span><b id="label">#7BF6DF</b></div><div class="palette" id="palette"></div><div class="gradient" id="gradient"></div></section></div><section class="card section"><h2>Quick Lab</h2><div class="toolsGrid"><div class="tool"><small>LIGHT</small><b id="light">—</b><button data-adjust="light">USE</button></div><div class="tool"><small>DARK</small><b id="dark">—</b><button data-adjust="dark">USE</button></div><div class="tool"><small>COMPLEMENT</small><b id="comp">—</b><button data-adjust="comp">USE</button></div></div></section></div></main></div><script>
const $=id=>document.getElementById(id);function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');if(!/^[0-9a-f]{6}$/i.test(h))return null;return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}}function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>Math.max(0,Math.min(255,Math.round(x))).toString(16).padStart(2,'0')).join('').toUpperCase()}function lum({r,g,b}){return[ r,g,b].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0)}function ratio(a,b){const A=lum(a),B=lum(b);return ((Math.max(A,B)+.05)/(Math.min(A,B)+.05)).toFixed(2)}function mix(a,b,t){return rgbToHex(a.r+(b.r-a.r)*t,a.g+(b.g-a.g)*t,a.b+(b.b-a.b)*t)}let active=hexToRgb($('hex').value);function render(){if(!active)return;const h=rgbToHex(active.r,active.g,active.b);$('hex').value=h;$('label').textContent=h;$('tile').style.background=h;$('ratio').textContent=ratio(active,{r:255,g:255,b:255})+' : 1';$('ratio2').textContent=ratio(active,{r:0,g:0,b:0})+' : 1';const white={r:255,g:255,b:255},black={r:0,g:0,b:0},comp={r:255-active.r,g:255-active.g,b:255-active.b};$('light').textContent=mix(active,white,.35);$('dark').textContent=mix(active,black,.35);$('comp').textContent=rgbToHex(comp.r,comp.g,comp.b);$('gradient').style.background='linear-gradient(110deg,'+mix(active,black,.15)+','+h+','+mix(active,white,.15)+')';const vals=[mix(active,black,.45),mix(active,black,.18),h,mix(active,white,.18),mix(active,white,.45),rgbToHex(comp.r,comp.g,comp.b)];$('palette').innerHTML=vals.map(x=>'<i class="sw" style="background:'+x+'" title="'+x+'" data-c="'+x+'"></i>').join('');document.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{active=hexToRgb(x.dataset.c);render()})}function apply(){const x=hexToRgb($('hex').value);if(x){active=x;render()}}$('apply').onclick=apply;$('hex').onkeydown=e=>{if(e.key==='Enter')apply()};$('random').onclick=()=>{active={r:Math.random()*256,g:Math.random()*256,b:Math.random()*256};render()};$('copy').onclick=()=>navigator.clipboard.writeText(rgbToHex(active.r,active.g,active.b));document.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>{const k=b.dataset.adjust;active=hexToRgb(k==='light'?$('light').textContent:k==='dark'?$('dark').textContent:$('comp').textContent);render()});document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>window.prism.window(b.dataset.win));render();
const sb=document.getElementById('soundBtn');let sfx=localStorage.getItem('prism-sfx')!=='off';function tone(){if(!sfx)return;try{const A=window.__prismAudio||(window.__prismAudio=new(window.AudioContext||window.webkitAudioContext)());if(A.state==='suspended')A.resume();const o=A.createOscillator(),g=A.createGain(),n=A.currentTime;o.type='sine';o.frequency.setValueAtTime(500,n);o.frequency.exponentialRampToValueAtTime(820,n+.08);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.012,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.11);o.connect(g).connect(A.destination);o.start(n);o.stop(n+.12)}catch(e){}}sb.textContent='SFX '+(sfx?'ON':'OFF');sb.onclick=()=>{sfx=!sfx;localStorage.setItem('prism-sfx',sfx?'on':'off');sb.textContent='SFX '+(sfx?'ON':'OFF');tone()};document.querySelectorAll('button').forEach(x=>x.addEventListener('pointerdown',tone,{passive:true}));</script></body></html>
