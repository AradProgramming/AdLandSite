<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chrono</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--a:#8da2ff;--b:#ffd36e;--bg:#07080c;--panel:#0e1119;--line:#ffffff12;--text:#f2f3f8;--muted:#747d8d}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Urbanist,Vazirmatn,sans-serif;background:radial-gradient(circle at 15% 8%,#8da2ff13,transparent 25%),radial-gradient(circle at 85% 90%,#ffd36e10,transparent 25%),var(--bg);color:var(--text)}button{font:inherit;color:inherit;cursor:pointer}.app{height:100%;display:grid;grid-template-rows:66px 1fr}.top{display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--line);background:#07080ce8;backdrop-filter:blur(21px)}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;color:#090a0d;font:900 11px Urbanist;box-shadow:0 0 35px #8da2ff22}.brand b{font:800 11px Urbanist;letter-spacing:.16em}.brand small{display:block;margin-top:3px;color:#677080;font:600 6px "IBM Plex Mono";letter-spacing:.11em}.tools{margin-left:auto;display:flex;gap:5px}.win{width:30px;height:30px;border:0;background:transparent;border-radius:8px;color:#7c8594}.win:hover{background:#ffffff08;color:#fff}.close:hover{background:#a53c4e;color:#fff}.main{overflow:auto;padding:24px}.wrap{max-width:1210px;margin:auto}.hero{display:grid;grid-template-columns:.8fr 1.2fr;gap:10px}.clockCard,.toolsCard{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#ffffff08,#ffffff02);box-shadow:0 34px 110px #0008}.clockCard{padding:25px;min-height:330px}.ey{font:800 7px "IBM Plex Mono";color:var(--a);letter-spacing:.2em}.clock{font:800 clamp(48px,7vw,85px) Urbanist;letter-spacing:-.08em;margin:11px 0}.date{font:600 9px "IBM Plex Mono";color:#70798a}.zone{margin-top:15px;display:inline-flex;padding:7px 9px;border:1px solid #8da2ff24;border-radius:99px;color:#9daaf0;font-size:7px}.toolsCard{padding:15px;display:grid;gap:8px}.world{display:grid;grid-template-columns:1fr 1fr;gap:8px}.city{padding:14px;border:1px solid #ffffff0d;border-radius:13px;background:#ffffff03}.city small{display:block;color:#606b7a;font:600 6px "IBM Plex Mono";letter-spacing:.1em}.city b{display:block;font:700 22px "IBM Plex Mono";margin-top:7px}.city span{display:block;color:#718093;font-size:7px;margin-top:3px}.section{margin-top:10px;padding:16px;border:1px solid var(--line);border-radius:17px;background:#ffffff03}.section h2{margin:0;font-size:15px}.timerRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.timer{padding:13px;border:1px solid #ffffff0d;border-radius:12px}.timer b{font:900 28px "IBM Plex Mono";color:var(--a)}.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}.btn{height:34px;padding:0 11px;border:1px solid #8da2ff33;background:#8da2ff09;color:#b5bff2;border-radius:9px;font:800 7px Urbanist}.primary{background:linear-gradient(135deg,var(--a),var(--b));border:0;color:#080b10}.timeline{height:6px;background:#151a25;border-radius:99px;overflow:hidden;margin-top:10px}.timeline i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .2s}@media(max-width:850px){.hero{grid-template-columns:1fr}.world{grid-template-columns:1fr 1fr}}@media(max-width:560px){.main{padding:13px}.world,.timerRow{grid-template-columns:1fr}.clock{font-size:55px}}
.ripple{position:fixed;width:8px;height:8px;border:1px solid var(--a);border-radius:50%;pointer-events:none;animation:r .5s forwards}@keyframes r{to{transform:scale(8);opacity:0}}
</style><style id="vertex-readable-ui">html{font-size:16px}body{font-size:14px!important}p{font-size:13px!important;line-height:1.75!important}small{font-size:11px!important;line-height:1.5!important;letter-spacing:.04em!important}button,a{font-size:12px!important;line-height:1.35!important}.btn,.tiny,.chip,.status,.label,.ey,.kicker,.badge,.pill{font-size:11px!important;letter-spacing:.04em!important}.nav button,.nav a{font-size:12px!important}.input,.field,input,textarea,select{font-size:13px!important;line-height:1.5!important}.head h1,h1{line-height:1.12!important}.head p{font-size:13px!important}.card p,.panel p,.content p{font-size:13px!important;line-height:1.75!important}@media(max-width:700px){body{font-size:14px!important}p{font-size:13px!important}.nav button,.nav a,button,a{font-size:12px!important}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">CH</div><div><b>CHRONO</b><small>TIME / ZONES / COUNTDOWN</small></div></div><div class="tools"><button class="win" onclick="window.chrono.window.min()">—</button><button class="win" onclick="window.chrono.window.max()">□</button><button class="win close" onclick="window.chrono.window.close()">×</button></div></header><main class="main"><div class="wrap"><section class="hero"><article class="clockCard"><div class="ey">LOCAL CLOCK / NOW</div><div class="clock" id="clock">00:00:00</div><div class="date" id="date"></div><span class="zone" id="zone"></span></article><article class="toolsCard"><div class="world" id="world"></div></article></section><section class="section"><h2>Time Lab</h2><div class="timerRow"><div class="timer"><small style="color:#667182;font-size:6px">STOPWATCH</small><b id="sw">00:00.0</b><div class="actions"><button class="btn primary" id="swStart">START</button><button class="btn" id="swReset">RESET</button></div></div><div class="timer"><small style="color:#667182;font-size:6px">COUNTDOWN</small><b id="cd">10:00</b><div class="actions"><button class="btn primary" id="cdStart">START</button><button class="btn" id="cdSet">SET 10 MIN</button></div><div class="timeline"><i id="cdBar"></i></div></div></div></section></div></main></div><script>
const cities=[['BAKU','Asia/Baku'],['TEHRAN','Asia/Tehran'],['LONDON','Europe/London'],['NEW YORK','America/New_York'],['TOKYO','Asia/Tokyo'],['SYDNEY','Australia/Sydney']];const $=s=>document.querySelector(s);function clock(){const d=new Date();$('#clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');$('#date').textContent=new Intl.DateTimeFormat('en',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(d);$('#zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;$('#world').innerHTML=cities.map(([name,zone])=>'<div class="city"><small>'+name+' / '+zone+'</small><b>'+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:zone}).format(d)+'</b><span>'+new Intl.DateTimeFormat('en',{dateStyle:'medium',timeZone:zone}).format(d)+'</span></div>').join('')}setInterval(clock,1000);clock();let sw=0,swi=null;$('#swStart').onclick=()=>{if(swi){clearInterval(swi);swi=null;$('#swStart').textContent='START'}else{swi=setInterval(()=>{sw+=.1;$('#sw').textContent=(Math.floor(sw/60)).toString().padStart(2,'0')+':'+(Math.floor(sw)%60).toString().padStart(2,'0')+'.'+Math.floor((sw%1)*10)},100);$('#swStart').textContent='PAUSE'}};$('#swReset').onclick=()=>{if(swi){clearInterval(swi);swi=null}sw=0;$('#sw').textContent='00:00.0';$('#swStart').textContent='START'};let cd=600,cdi=null;function draw(){cd=Math.max(0,cd-.1);$('#cd').textContent=Math.floor(cd/60).toString().padStart(2,'0')+':'+Math.floor(cd%60).toString().padStart(2,'0');$('#cdBar').style.width=((1-cd/600)*100)+'%';if(!cd){clearInterval(cdi);cdi=null;$('#cdStart').textContent='START'}}$('#cdStart').onclick=()=>{if(cdi){clearInterval(cdi);cdi=null;$('#cdStart').textContent='START'}else{cdi=setInterval(draw,100);$('#cdStart').textContent='PAUSE'}};$('#cdSet').onclick=()=>{if(cdi)clearInterval(cdi);cdi=null;cd=600;$('#cd').textContent='10:00';$('#cdBar').style.width='0%';$('#cdStart').textContent='START'};document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>{try{const A=window.__c||(window.__c=new AudioContext()),o=A.createOscillator(),g=A.createGain(),n=A.currentTime;o.frequency.setValueAtTime(420,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.01,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.08);o.connect(g).connect(A.destination);o.start(n);o.stop(n+.09)}catch(e){}},{passive:true}));
</script></body></html>
