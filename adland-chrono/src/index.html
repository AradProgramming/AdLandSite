.launchScreen{position:fixed;inset:0;z-index:999999;background:#040608;display:grid;place-items:center;transition:opacity .65s,visibility .65s;font-family:Inter,Vazirmatn,"Segoe UI",sans-serif}.lsGrid{position:absolute;inset:0;background:linear-gradient(#fff004 1px,transparent 1px),linear-gradient(90deg,#fff004 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(circle,#000,transparent 74%);animation:lsGrid 15s linear infinite}.lsCard{position:relative;width:min(510px,calc(100% - 30px));padding:34px 30px;text-align:center;border:1px solid #8da2ff38;border-radius:27px;background:#080c12ef;box-shadow:0 55px 180px #000e}.lsOrbit{width:160px;height:160px;display:grid;place-items:center;position:relative;margin:auto}.lsOrbit:before,.lsOrbit:after{content:"";position:absolute;inset:0;border:1px solid #8da2ff4c;border-radius:50%;animation:lsSpin 10s linear infinite}.lsOrbit:after{inset:-16px;border-style:dashed;border-color:#8da2ff24;animation-duration:20s;animation-direction:reverse}.lsOrbit span:first-child{position:absolute;top:4px;right:28px;width:7px;height:7px;border-radius:50%;background:#8da2ff;box-shadow:0 0 15px #8da2ff;z-index:3;animation:lsPulse 1.6s infinite}.lsOrbit span:nth-child(2){position:absolute;bottom:21px;left:27px;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 10px #fff;z-index:3}.lsOrbit img{width:108px;height:108px;border-radius:50%;object-fit:cover;position:relative;z-index:2;box-shadow:0 0 65px #8da2ff22;animation:lsFloat 3s ease-in-out infinite}.lsCard>small{display:block;margin-top:18px;color:#8da2ff;font:800 9px Inter;letter-spacing:.21em}.lsCard>b{display:block;margin-top:7px;color:#f2ede3;font:900 27px Inter}.lsCard>b em{color:#8da2ff;font-style:normal}.lsCard>p{margin:7px 0 0;color:#748188;font:600 11px Inter}.lsBar{width:88%;height:4px;margin:20px auto 9px;background:#fff10;border-radius:99px;overflow:hidden}.lsBar i{display:block;width:0;height:100%;background:linear-gradient(90deg,#8da2ff,#fff (()=>{const s=document.getElementById('launchScreen');if(!s)return;const fill=document.getElementById('lsFill'),pct=document.getElementById('lsPct'),txt=document.getElementById('lsText'),enter=document.getElementById('lsEnter');let done=false,start=performance.now();function exit(){if(done)return;done=true;s.style.opacity='0';s.style.visibility='hidden';setTimeout(()=>s.remove(),720)}enter.onclick=exit;function loop(t){if(done)return;const p=Math.min(100,Math.floor((t-start)/14));fill.style.width=p+'%';pct.textContent=String(p).padStart(2,'0')+'%';txt.textContent=p<35?'STARTING LOCAL CORE':p<70?'LOADING WORKSPACE':'READY';if(p>=100){enter.disabled=false;setTimeout(exit,200)}else requestAnimationFrame(loop)}requestAnimationFrame(loop);setTimeout(()=>{if(!done){fill.style.width='100%';pct.textContent='100%';txt.textContent='READY';enter.disabled=false}},1850)})();
</script><div class="app"><header class="top"><div class="brand"><div class="logo">CH</div><div><b>CHRONO</b><small>TIME / ZONES / COUNTDOWN</small></div></div><div class="tools"><button class="win" onclick="window.chrono.window.min()">—</button><button class="win" onclick="window.chrono.window.max()">□</button><button class="win close" onclick="window.chrono.window.close()">×</button></div></header><main class="main"><div class="wrap"><section class="hero"><article class="clockCard"><div class="ey">LOCAL CLOCK / NOW</div><div class="clock" id="clock">00:00:00</div><div class="date" id="date"></div><span class="zone" id="zone"></span></article><article class="toolsCard"><div class="world" id="world"></div></article></section><section class="section"><h2>Time Lab</h2><div class="timerRow"><div class="timer"><small style="color:#667182;font-size:6px">STOPWATCH</small><b id="sw">00:00.0</b><div class="actions"><button class="btn primary" id="swStart">START</button><button class="btn" id="swReset">RESET</button></div></div><div class="timer"><small style="color:#667182;font-size:6px">COUNTDOWN</small><b id="cd">10:00</b><div class="actions"><button class="btn primary" id="cdStart">START</button><button class="btn" id="cdSet">SET 10 MIN</button></div><div class="timeline"><i id="cdBar"></i></div></div></div></section></div></main></div><script>
const cities=[['BAKU','Asia/Baku'],['TEHRAN','Asia/Tehran'],['LONDON','Europe/London'],['NEW YORK','America/New_York'],['TOKYO','Asia/Tokyo'],['SYDNEY','Australia/Sydney']];const $=s=>document.querySelector(s);function clock(){const d=new Date();$('#clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');$('#date').textContent=new Intl.DateTimeFormat('en',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(d);$('#zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;$('#world').innerHTML=cities.map(([name,zone])=>'<div class="city"><small>'+name+' / '+zone+'</small><b>'+new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:zone}).format(d)+'</b><span>'+new Intl.DateTimeFormat('en',{dateStyle:'medium',timeZone:zone}).format(d)+'</span></div>').join('')}setInterval(clock,1000);clock();let sw=0,swi=null;$('#swStart').onclick=()=>{if(swi){clearInterval(swi);swi=null;$('#swStart').textContent='START'}else{swi=setInterval(()=>{sw+=.1;$('#sw').textContent=(Math.floor(sw/60)).toString().padStart(2,'0')+':'+(Math.floor(sw)%60).toString().padStart(2,'0')+'.'+Math.floor((sw%1)*10)},100);$('#swStart').textContent='PAUSE'}};$('#swReset').onclick=()=>{if(swi){clearInterval(swi);swi=null}sw=0;$('#sw').textContent='00:00.0';$('#swStart').textContent='START'};let cd=600,cdi=null;function draw(){cd=Math.max(0,cd-.1);$('#cd').textContent=Math.floor(cd/60).toString().padStart(2,'0')+':'+Math.floor(cd%60).toString().padStart(2,'0');$('#cdBar').style.width=((1-cd/600)*100)+'%';if(!cd){clearInterval(cdi);cdi=null;$('#cdStart').textContent='START'}}$('#cdStart').onclick=()=>{if(cdi){clearInterval(cdi);cdi=null;$('#cdStart').textContent='START'}else{cdi=setInterval(draw,100);$('#cdStart').textContent='PAUSE'}};$('#cdSet').onclick=()=>{if(cdi)clearInterval(cdi);cdi=null;cd=600;$('#cd').textContent='10:00';$('#cdBar').style.width='0%';$('#cdStart').textContent='START'};document.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',()=>{try{const A=window.__c||(window.__c=new AudioContext()),o=A.createOscillator(),g=A.createGain(),n=A.currentTime;o.frequency.setValueAtTime(420,n);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.01,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.08);o.connect(g).connect(A.destination);o.start(n);o.stop(n+.09)}catch(e){}},{passive:true}));
