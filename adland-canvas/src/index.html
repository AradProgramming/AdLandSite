<style>

.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.field{border:1px solid var(--line);background:#ffffffb8;color:var(--ink);border-radius:10px;padding:10px;outline:0;width:100%;font:11px "Segoe UI"}.field:focus{border-color:#b06a2e60;box-shadow:0 0 0 3px #b06a2e0a}.gallery{display:grid;grid-template-columns:1.3fr .7fr;gap:12px}.wall{padding:13px;min-height:640px}.masonry{columns:4 220px;column-gap:10px}.tile{break-inside:avoid;position:relative;margin:0 0 10px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#eae3d5;cursor:pointer;animation:rise .35s both}.tile img{width:100%;display:block;max-height:320px;object-fit:cover;transition:.4s}.tile:hover img{transform:scale(1.035)}.tileInfo{padding:9px;background:#fffaf5}.tileInfo b{font:800 9px "Segoe UI";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.tileInfo small{font:7px "Segoe UI";color:#9d968c}.pin{position:absolute;top:8px;right:8px;border:1px solid #fff8;background:#332b20b8;color:#fff;border-radius:9px;width:28px;height:28px}.pin.on{background:#b06a2e;color:#fff}.drop{border:1px dashed #b06a2e48;border-radius:13px;padding:12px;text-align:center;color:#9e968b;font:9px "Segoe UI";margin-bottom:10px;background:#b06a2e07}.detail{padding:14px;position:sticky;top:0;height:fit-content}.preview{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#e9e1d3;border:1px solid var(--line);display:grid;place-items:center}.preview img{max-width:100%;max-height:100%;object-fit:contain;transition:.25s}.fileName{font:800 13px "Segoe UI";margin:12px 0 3px;word-break:break-word}.meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.metaBox{padding:9px;border:1px solid var(--line);border-radius:10px;background:#ffffff7a}.metaBox small{display:block;font:7px "Segoe UI";color:#9c958a}.metaBox b{display:block;font:800 9px "Segoe UI";margin-top:4px}.colors{display:flex;gap:6px;margin:11px 0}.sw{width:27px;height:27px;border-radius:8px;border:1px solid #0002;cursor:pointer}.controlGrid{display:grid;gap:7px;margin-top:10px}.row{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}.value{font:8px "Segoe UI";color:var(--accent);text-align:right}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font:7px "Segoe UI";border:1px solid #b06a2e26;border-radius:99px;padding:4px 7px;color:#936035;background:#b06a2e07}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.mini{height:29px;border:1px solid var(--line);background:#fff9;border-radius:9px;padding:0 9px;font:8px "Segoe UI";color:#817b70}.mini:hover{background:#fff;color:var(--ink)}.mini.active{background:#b06a2e10;color:#884e21;border-color:#b06a2e44}
.mood{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:105px;gap:9px}.mood .tile{height:100%;margin:0}.mood .tile:nth-child(3n){grid-column:span 2;grid-row:span 2}.mood .tile:nth-child(4n){grid-row:span 2}.mood .tile img{height:100%;max-height:none;object-fit:cover}.mood .tileInfo{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000b);color:#fff;padding-top:30px}.mood .tileInfo small{color:#ddd}
.empty{min-height:570px;display:grid;place-items:center;text-align:center;color:#948e83;font:10px "Segoe UI"}.emptyIcon{width:84px;height:84px;border-radius:24px;border:1px solid #b06a2e2c;background:#b06a2e08;display:grid;place-items:center;color:var(--accent);font:28px Georgia;animation:lift 5s ease-in-out infinite;margin:auto}
.settings{padding:17px}.setting{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:15px 0;border-top:1px solid var(--line)}.setting:first-child{border-top:0}.setting b{font:800 10px "Segoe UI"}.setting small{display:block;color:#9a948a;font:8px "Segoe UI";margin-top:4px}.themeRow{display:flex;gap:6px;flex-wrap:wrap}.themeDot{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer}.themeDot.active{border-color:var(--ink)}
.toast{position:fixed;left:20px;bottom:20px;padding:10px 12px;border-radius:10px;background:#29251fdd;color:white;opacity:0;transform:translateY(8px);transition:.2s;font:9px "Segoe UI";z-index:50}.toast.show{opacity:1;transform:none}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}html.reduced *{animation:none!important;transition:none!important}
@media(max-width:1100px){.gallery{grid-template-columns:1fr}.detail{position:relative}.mood{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:18px}.mood{grid-template-columns:repeat(2,1fr)}.top .search{display:none}.brand{min-width:0}.masonry{columns:2 150px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand"><div class="logo">AC</div><div><b>ADLAND CANVAS</b><small>VISUAL ASSET STUDIO</small></div></div><button class="search" id="search"><span>⌕</span><span id="searchText">Search the library</span><kbd>Ctrl ⇧ Space</kbd></button><div class="topTools"><span class="tiny">LOCAL</span><button class="win" data-win="min">—</button><button class="win" data-win="max">□</button><button class="win close" data-win="close">×</button></div></header><div class="shell"><aside class="side"><div class="label" id="workspaceLabel">STUDIO</div><nav class="nav" id="nav"></nav><div class="sideFoot"><b>AdLand Studio</b><br>Windows x64 · local-first</div></aside><main class="main"><div class="page" id="view"></div></main></div></div><div class="toast" id="toast"></div>
<script>
const NAV=[['library','▦'],['moodboard','▧'],['favorites','★'],['palette','◈'],['settings','◇']];
const TX={en:{library:'Library',moodboard:'Moodboard',favorites:'Favorites',palette:'Palette',settings:'Settings',libraryTitle:'Visual library',libraryDesc:'Collect and inspect your creative assets without leaving your machine.',moodTitle:'Moodboard',moodDesc:'Turn your image set into a living visual wall.',favTitle:'Favorites',favDesc:'Your pinned assets.',paletteTitle:'Palette lab',paletteDesc:'Extract dominant colors from the selected image.',settingsTitle:'Canvas settings',settingsDesc:'Visual vibe, sound and language.',add:'+ Add images',drop:'Drop images here or use Add images.',empty:'No images yet',emptyDesc:'Add a few assets and Canvas will build the wall.',select:'Select an image',file:'File',size:'Size',type:'Type',dimensions:'Dimensions',note:'Note',notePh:'Add a note about this image…',tags:'Tags',tagPh:'new tag',addTag:'Add',reveal:'Show in folder',copy:'Copy path',favorite:'Favorite',remove:'Remove',export:'Export palette',exportImage:'Export PNG',shuffle:'Shuffle layout',language:'Language',english:'English',persian:'فارسی',theme:'Theme',themeDesc:'Choose a different creative vibe.',sound:'Interface sound',soundDesc:'Soft interface clicks.',animations:'Motion',reduced:'Reduce motion',reducedDesc:'Reduce movement.',site:'Open Canvas website',devices:'Available device',windows:'Windows 10/11 · x64',copied:'Copied',saved:'Saved',none:'—',all:'All',ink:'Ink',paper:'Paper',mint:'Mint',neon:'Neon'},fa:{library:'کتابخانه',moodboard:'مودبرد',favorites:'موردعلاقه‌ها',palette:'پالت',settings:'تنظیمات',libraryTitle:'کتابخانه تصویری',libraryDesc:'دارایی‌های خلاقانه را بدون خروج از دستگاهت جمع‌آوری و بررسی کن.',moodTitle:'مودبرد',moodDesc:'مجموعه تصاویرت را به یک دیوار بصری زنده تبدیل کن.',favTitle:'موردعلاقه‌ها',favDesc:'دارایی‌های پین‌شده تو.',paletteTitle:'آزمایشگاه پالت',paletteDesc:'رنگ‌های غالب تصویر انتخاب‌شده را استخراج کن.',settingsTitle:'تنظیمات Canvas',settingsDesc:'حال‌وهوای بصری، صدا و زبان.',add:'+ افزودن تصاویر',drop:'تصاویر را اینجا رها کن یا از افزودن استفاده کن.',empty:'هنوز تصویری نیست',emptyDesc:'چند دارایی اضافه کن تا Canvas دیوار تصویری را بسازد.',select:'یک تصویر انتخاب کن',file:'فایل',size:'حجم',type:'نوع',dimensions:'ابعاد',note:'یادداشت',notePh:'یادداشتی درباره این تصویر…',tags:'برچسب‌ها',tagPh:'برچسب جدید',addTag:'افزودن',reveal:'نمایش در پوشه',copy:'کپی مسیر',favorite:'موردعلاقه',remove:'حذف',export:'خروجی پالت',exportImage:'خروجی PNG',shuffle:'چیدمان تصادفی',language:'زبان',english:'English',persian:'فارسی',theme:'تم',themeDesc:'یک حال‌وهوای خلاقانه متفاوت انتخاب کن.',sound:'صدای رابط',soundDesc:'کلیک‌های ظریف رابط.',animations:'حرکت',reduced:'کاهش حرکت',reducedDesc:'حرکت‌ها را کمتر کن.',site:'باز کردن وب‌سایت Canvas',devices:'دستگاه در دسترس',windows:'Windows 10/11 · x64',copied:'کپی شد',saved:'ذخیره شد',none:'—',all:'همه',ink:'جوهر',paper:'کاغذ',mint:'نعناعی',neon:'نئون'}};
const THEMES={paper:['#b06a2e','#df9d58','#f5f1e8','#fbf9f4'],ink:['#d5aa64','#8f6b4e','#11100e','#191714'],mint:['#3e806f','#8bc7a5','#edf5ef','#f8fcf7'],neon:['#8b63ff','#ff5fc7','#090811','#12101d']};
const base={lang:'en',page:'library',theme:'paper',sound:true,reduced:false,items:[],selected:null,filter:'',boardSeed:0};
let state;try{state=Object.assign({},base,JSON.parse(localStorage.getItem('adland-canvas')||'{}'))}catch(e){state={...base}}state.items=Array.isArray(state.items)?state.items:[];state.selected=state.selected||state.items[0]?.id||null;
let cache={};const $=id=>document.getElementById(id),t=k=>(TX[state.lang]||TX.en)[k]||TX.en[k]||k;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const save=()=>localStorage.setItem('adland-canvas',JSON.stringify(state));
function tone(k='click'){if(!state.sound||state.reduced)return;try{const A=window.__a||(window.__a=new(window.AudioContext||webkitAudioContext)()),o=A.createOscillator(),g=A.createGain(),n=A.currentTime;const f=k==='ok'?[520,760]:[260,380];o.frequency.setValueAtTime(f[0],n);o.frequency.exponentialRampToValueAtTime(f[1],n+.06);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.022,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.09);o.connect(g).connect(A.destination);o.start(n);o.stop(n+.1)}catch(e){}}
function theme(){const [a,b,bg,surface]=THEMES[state.theme]||THEMES.paper;document.documentElement.style.setProperty('--accent',a);document.documentElement.style.setProperty('--accent2',b);document.documentElement.style.setProperty('--paper',bg);document.documentElement.style.setProperty('--surface',surface);document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';document.documentElement.classList.toggle('reduced',state.reduced);$('searchText').textContent=t('library')}
function bytes(n){if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(1)+' MB'}
function toast(x){const z=$('toast');z.textContent=x;z.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>z.classList.remove('show'),1500)}
async function hydrate(item){if(cache[item.id])return cache[item.id];try{const r=await window.canvas.readImage(item.path);const im=new Image();im.src=r.data;await new Promise((res,rej)=>{im.onload=res;im.onerror=rej});item.size=r.size;item.width=im.naturalWidth;item.height=im.naturalHeight;cache[item.id]=r.data;return r.data}catch(e){item.offline=true;return null}}
async function addImages(){tone('ok');const list=await window.canvas.pickImages();for(const x of list){if(state.items.some(i=>i.path===x.path))continue;const item={id:crypto.randomUUID(),...x,favorite:false,note:'',tags:[],offline:false,fx:{brightness:100,contrast:100,saturation:100,rotation:0}};state.items.unshift(item);await hydrate(item);if(!state.selected)state.selected=item.id}save();render();toast(t('saved'))}
function head(k,title,desc,action){return '<div class="head"><div><div class="ey">'+k+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(action||'')+'</div>'}
function filtered(){let a=state.items.filter(x=>state.page==='favorites'?x.favorite:true);const q=state.filter.trim().toLowerCase();return q?a.filter(x=>(x.name+' '+x.note+' '+x.tags.join(' ')).toLowerCase().includes(q)):a}
function tile(x,i){const data=cache[x.id]||'';return '<article class="tile" style="animation-delay:'+(i*25)+'ms" data-select="'+x.id+'">'+(data?'<img src="'+data+'" alt="'+esc(x.name)+'">':'<div style="height:170px;display:grid;place-items:center;color:#9d958a;font:9px \\\'Segoe UI\\\'">'+(x.offline?'Offline':'Loading…')+'</div>')+'<button class="pin '+(x.favorite?'on':'')+'" data-pin="'+x.id+'">★</button><div class="tileInfo"><b>'+esc(x.name)+'</b><small>'+esc(x.type||'IMAGE')+' · '+bytes(x.size||0)+'</small></div></article>'}
function detail(){const x=state.items.find(a=>a.id===state.selected);if(!x)return '<aside class="card detail"><div class="empty"><div><div class="emptyIcon">◈</div><h3>'+t('select')+'</h3></div></div></aside>';const data=cache[x.id]||'';const fx=x.fx||{};return '<aside class="card detail"><div class="preview"><img id="previewImg" src="'+data+'" style="filter:brightness('+(fx.brightness||100)+'%) contrast('+(fx.contrast||100)+'%) saturate('+(fx.saturation||100)+'%);transform:rotate('+(fx.rotation||0)+'deg)"></div><div class="fileName">'+esc(x.name)+'</div><div class="tags">'+x.tags.map(a=>'<span class="tag">'+esc(a)+'</span>').join('')+'</div><div class="meta"><div class="metaBox"><small>'+t('dimensions')+'</small><b>'+((x.width||0)+' × '+(x.height||0))+'</b></div><div class="metaBox"><small>'+t('size')+'</small><b>'+bytes(x.size||0)+'</b></div><div class="metaBox"><small>'+t('type')+'</small><b>'+esc(x.type||'IMAGE')+'</b></div><div class="metaBox"><small>'+t('devices')+'</small><b>'+t('windows')+'</b></div></div><div style="margin-top:12px;font:9px \\\'Segoe UI\\\';color:#8f897f">'+t('note')+'</div><textarea class="field" id="note" placeholder="'+t('notePh')+'">'+esc(x.note||'')+'</textarea><div class="actions"><button class="mini" id="reveal">'+t('reveal')+'</button><button class="mini" id="copy">'+t('copy')+'</button><button class="mini '+(x.favorite?'active':'')+'" id="fav">★ '+t('favorite')+'</button><button class="mini" id="remove">'+t('remove')+'</button><button class="btn" id="exportImage">'+t('exportImage')+'</button></div><div class="controlGrid"><div class="row"><input class="range" id="bright" type="range" min="50" max="150" value="'+(fx.brightness||100)+'"><span class="value">'+t('brightness')+'</span></div><div class="row"><input class="range" id="contrast" type="range" min="50" max="150" value="'+(fx.contrast||100)+'"><span class="value">'+t('contrast')+'</span></div><div class="row"><input class="range" id="saturation" type="range" min="0" max="180" value="'+(fx.saturation||100)+'"><span class="value">'+t('saturation')+'</span></div></div><div class="actions"><button class="mini" id="rotate">↻ Rotate</button><input id="tagInput" class="field" style="flex:1" placeholder="'+t('tagPh')+'"><button class="mini" id="addTag">'+t('addTag')+'</button></div></aside>'}
function library(){const arr=filtered();return head('VISUAL LIBRARY',t('libraryTitle'),t('libraryDesc'),'<button class="btn primary" id="add">'+t('add')+'</button>')+'<div class="gallery"><section class="card wall"><div class="drop" id="drop">'+t('drop')+'</div><div class="toolbar"><input class="field" id="searchBox" placeholder="'+t('library')+'" value="'+esc(state.filter)+'"></div>'+(arr.length?'<div class="masonry">'+arr.map(tile).join('')+'</div>':'<div class="empty"><div><div class="emptyIcon">AC</div><h3>'+t('empty')+'</h3><p>'+t('emptyDesc')+'</p><button class="btn primary" id="add2">'+t('add')+'</button></div></div>')+'</section>'+detail()+'</div>'}
function moodboard(){const arr=filtered();return head('VISUAL WALL',t('moodTitle'),t('moodDesc'),'<button class="btn" id="shuffle">'+t('shuffle')+'</button>')+'<section class="card" style="padding:13px;min-height:650px">'+(arr.length?'<div class="mood">'+[...arr].sort(()=>Math.sin(state.boardSeed+Math.random())-.5).map(tile).join('')+'</div>':'<div class="empty"><div><div class="emptyIcon">✦</div><h3>'+t('empty')+'</h3></div></div>')+'</section>'}
function palette(){const x=state.items.find(a=>a.id===state.selected);return head('COLOR STUDY',t('paletteTitle'),t('paletteDesc'),'<button class="btn" data-go="library">← '+t('library')+'</button>')+'<section class="card" style="padding:17px;min-height:620px">'+(x?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="preview" style="height:520px"><img src="'+(cache[x.id]||'')+'"></div><div><h3 style="font:800 18px \\\'Segoe UI\\\';margin:4px 0">'+esc(x.name)+'</h3><div class="colors" id="colors"></div><button class="btn primary" id="export">'+t('export')+'</button></div></div>':'<div class="empty"><div><div class="emptyIcon">◈</div><h3>'+t('select')+'</h3></div></div>')+'</section>'}
function settings(){return head('PREFERENCES',t('settingsTitle'),t('settingsDesc'))+'<section class="card settings"><div class="setting"><div><b>'+t('language')+'</b><small>'+t('languageDesc','Switch language.')+'</small></div><select id="lang" class="field" style="width:150px"><option value="en" '+(state.lang==='en'?'selected':'')+'>'+t('english')+'</option><option value="fa" '+(state.lang==='fa'?'selected':'')+'>'+t('persian')+'</option></select></div><div class="setting"><div><b>'+t('theme')+'</b><small>'+t('themeDesc')+'</small></div><div class="themeRow">'+Object.entries(THEMES).map(([k,v])=>'<button class="themeDot '+(state.theme===k?'active':'')+'" data-theme="'+k+'" style="background:linear-gradient(135deg,'+v[0]+','+v[1]+')" title="'+k+'"></button>').join('')+'</div></div><div class="setting"><div><b>'+t('sound')+'</b><small>'+t('soundDesc')+'</small></div><button class="mini '+(state.sound?'active':'')+'" id="sound">'+(state.sound?'ON':'OFF')+'</button></div><div class="setting"><div><b>'+t('animations')+'</b><small>'+t('reducedDesc')+'</small></div><button class="mini '+(state.reduced?'active':'')+'" id="reduced">'+(state.reduced?'REDUCED':'FULL')+'</button></div><div class="setting"><div><b>'+t('site')+'</b><small>AdLand Studio</small></div><div class="actions"><a class="mini" href="https://aradprogramming.github.io/AdLandSite/canvas/" target="_blank" rel="noopener">'+t('site')+'</a><a class="mini" href="https://aradprogramming.github.io/AdLandSite/" target="_blank" rel="noopener">AdLand Site</a></div></div></section>'}
function render(){theme();$('nav').innerHTML=NAV.map(n=>'<button class="'+(state.page===n[0]?'active':'')+'" data-go="'+n[0]+'"><i>'+n[1]+'</i>'+t(n[0])+'</button>').join('');$('view').innerHTML=state.page==='library'?library():state.page==='moodboard'?moodboard():state.page==='favorites'?library():state.page==='palette'?palette():settings();bind();hydrateVisible();if(state.page==='palette')extractPalette()}
async function hydrateVisible(){
 for(const x of filtered()){if(!cache[x.id]&&!x.offline)await hydrate(x)}
 renderTiles();
}
function renderTiles(){
 const m=document.querySelector('.masonry');if(m)m.innerHTML=filtered().map(tile).join('');
 const md=document.querySelector('.mood');if(md)md.innerHTML=filtered().map(tile).join('');
 bindTile();
}
function bindTile(){
 document.querySelectorAll('[data-select]').forEach(b=>b.onclick=e=>{if(e.target.closest('[data-pin]'))return;state.selected=b.dataset.select;save();render()});
 document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=e=>{e.stopPropagation();const x=state.items.find(a=>a.id===b.dataset.pin);if(x){x.favorite=!x.favorite;save();tone('ok');render()}});
}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.page=b.dataset.go;save();tone();render()});
 const add=$('add'),add2=$('add2');if(add)add.onclick=addImages;if(add2)add2.onclick=addImages;
 const box=$('searchBox');if(box)box.oninput=()=>{state.filter=box.value;save();renderTiles()};
 const drop=$('drop');
 if(drop){
  drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#b06a2e99'};
  drop.ondrop=async e=>{
   e.preventDefault();
   const list=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));
   for(const f of list){
    const p=f.path;if(!p||state.items.some(x=>x.path===p))continue;
    const item={id:crypto.randomUUID(),path:p,name:f.name,type:(f.name.split('.').pop()||'').toUpperCase(),size:f.size,favorite:false,note:'',tags:[],offline:false,fx:{brightness:100,contrast:100,saturation:100,rotation:0}};
    state.items.unshift(item);await hydrate(item);state.selected=state.selected||item.id;
   }
   save();render();toast(t('saved'));
  };
 }
 const note=$('note');if(note)note.oninput=()=>{const x=state.items.find(a=>a.id===state.selected);if(x){x.note=note.value;save()}};
 const rev=$('reveal');if(rev)rev.onclick=()=>window.canvas.reveal(state.items.find(a=>a.id===state.selected)?.path);
 const cp=$('copy');if(cp)cp.onclick=()=>window.canvas.copy(state.items.find(a=>a.id===state.selected)?.path).then(()=>toast(t('copied')));
 const fav=$('fav');if(fav)fav.onclick=()=>{const x=state.items.find(a=>a.id===state.selected);if(x){x.favorite=!x.favorite;save();tone('ok');render()}};
 const rem=$('remove');if(rem)rem.onclick=()=>{state.items=state.items.filter(a=>a.id!==state.selected);delete cache[state.selected];state.selected=state.items[0]?.id||null;save();render()};
 const rot=$('rotate');if(rot)rot.onclick=()=>{const x=state.items.find(a=>a.id===state.selected);if(x){x.fx.rotation=(x.fx.rotation+90)%360;save();render()}};
 for(const id of ['bright','contrast','saturation']){
  const q=$(id);if(q)q.oninput=()=>{const x=state.items.find(a=>a.id===state.selected);if(!x)return;x.fx[id==='bright'?'brightness':id]=+q.value;const im=$('previewImg');if(im)im.style.filter='brightness('+(x.fx.brightness||100)+'%) contrast('+(x.fx.contrast||100)+'%) saturate('+(x.fx.saturation||100)+'%)';save()};
 }
 const addTag=$('addTag');if(addTag)addTag.onclick=()=>{const x=state.items.find(a=>a.id===state.selected),v=$('tagInput').value.trim();if(x&&v&&!x.tags.includes(v)){x.tags.push(v);save();render()}};const exportImage=$('exportImage');if(exportImage)exportImage.onclick=()=>exportCurrentImage();
 const lang=$('lang');if(lang)lang.onchange=()=>{state.lang=lang.value;save();render()};
 document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();tone('ok');render()});
 const snd=$('sound');if(snd)snd.onclick=()=>{state.sound=!state.sound;save();render();if(state.sound)tone('ok')};
 const rd=$('reduced');if(rd)rd.onclick=()=>{state.reduced=!state.reduced;save();render()};
 const sh=$('shuffle');if(sh)sh.onclick=()=>{state.boardSeed++;save();tone('ok');render()};
 const ex=$('export');if(ex)ex.onclick=async()=>{const colors=await extractPalette();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({asset:state.items.find(x=>x.id===state.selected)?.name,colors},null,2)],{type:'application/json'}));a.download='adland-canvas-palette.json';a.click()};
}
async function exportCurrentImage(){
 const x=state.items.find(a=>a.id===state.selected);if(!x||!cache[x.id])return;
 const im=new Image();im.src=cache[x.id];await new Promise((res,rej)=>{im.onload=res;im.onerror=rej});
 const ang=((x.fx?.rotation||0)%360+360)%360,swap=ang===90||ang===270,w=im.naturalWidth,h=im.naturalHeight;
 const c=document.createElement('canvas');c.width=swap?h:w;c.height=swap?w:h;const ctx=c.getContext('2d');ctx.filter='brightness('+(x.fx?.brightness||100)+'%) contrast('+(x.fx?.contrast||100)+'%) saturate('+(x.fx?.saturation||100)+'%)';ctx.translate(c.width/2,c.height/2);ctx.rotate(ang*Math.PI/180);ctx.drawImage(im,-w/2,-h/2);
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='adland-canvas-'+x.name.replace(/\.[^.]+$/,'')+'.png';a.click();toast(t('exportImage'));tone('ok');
}
async function extractPalette(){const x=state.items.find(a=>a.id===state.selected);if(!x||!cache[x.id])return[];const im=new Image();im.src=cache[x.id];await new Promise((res,rej)=>{im.onload=res;im.onerror=rej});const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=64;c.height=64;ctx.drawImage(im,0,0,64,64);const d=ctx.getImageData(0,0,64,64).data,bin={};for(let i=0;i<d.length;i+=16){if(d[i+3]<80)continue;const r=Math.round(d[i]/32)*32,g=Math.round(d[i+1]/32)*32,b=Math.round(d[i+2]/32)*32,k=r+','+g+','+b;bin[k]=(bin[k]||0)+1}const colors=Object.entries(bin).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k])=>'#'+k.split(',').map(v=>Number(v).toString(16).padStart(2,'0')).join(''));const el=$('colors');if(el)el.innerHTML=colors.map(c=>'<button class="sw" style="background:'+c+'" title="'+c+'" data-color="'+c+'"></button>').join('');document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(b.dataset.color).then(()=>toast(b.dataset.color)));return colors}
$('search').onclick=()=>{const q=prompt(t('library'));if(q!==null){state.filter=q;state.page='library';render()}};document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>window.canvas.window(b.dataset.win));render();
</script></body></html>
