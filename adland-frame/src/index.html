const THEMES={midnight:['#ffb86b','#ff6b9a','#0a0a0f'],aurora:['#7fffd4','#8ea7ff','#071019'],ember:['#ff8a65','#ffd166','#120b09'],ocean:['#66d9ff','#7f8cff','#071018'],mono:['#e8e8e8','#989898','#0c0c0c']};

function applyTheme(){const a=THEMES[state.theme]||THEMES.midnight;document.documentElement.style.setProperty('--a',a[0]);document.documentElement.style.setProperty('--a2',a[1]);document.documentElement.style.setProperty('--bg',a[2]);document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='fa'?'rtl':'ltr';document.documentElement.classList.toggle('reduced',state.reduced);$('#langLabel').textContent=state.lang.toUpperCase()}

const DB_NAME='adland-frame-images',STORE_NAME='images';function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE_NAME))r.result.createObjectStore(STORE_NAME)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}

function activeFile(){return state.files[state.active]||null}
function gallery(){return '<div class="head"><div><div class="ey">FRAME STUDIO</div><h1>'+t('gallery')+'</h1><p>'+t('drop')+'</p></div><button class="btn primary" id="choose">'+t('choose')+'</button></div><section class="card dropzone" id="dropzone"><div><div class="dropIcon">▣</div><b>'+t('empty')+'</b><p class="muted">'+t('drop')+'</p></div></section><div class="gallery">'+state.files.map((f,i)=>'<div class="tile" data-file="'+i+'"><img src="'+f.url+'"><span class="badge">'+(f.favorite?'★':'')+'</span><div class="shade"><b>'+esc(f.name)+'</b><small>'+Math.round(f.size/1024)+' KB</small></div></div>').join('')+'</div>'}
function edit(){const f=activeFile();if(!f)return gallery();const x=state.fx;return '<div class="head"><div><div class="ey">FRAME LAB</div><h1>'+t('edit')+'</h1><p>'+esc(f.name)+'</p></div><div class="toolbar"><button class="mini" id="backGallery">'+t('gallery')+'</button><button class="mini" id="compare">COMPARE</button><button class="btn primary" id="export">'+t('export')+'</button></div></div><div class="workspace"><section class="card preview"><img id="preview" src="'+f.url+'"></section><section class="card sidePanel"><div class="control"><label>'+t('brightness')+'</label><div class="ctrlRow"><input class="range" id="brightness" type="range" min="20" max="180" value="'+x.brightness+'"><span class="value" id="bv">'+x.brightness+'%</span></div></div><div class="control"><label>'+t('contrast')+'</label><div class="ctrlRow"><input class="range" id="contrast" type="range" min="20" max="180" value="'+x.contrast+'"><span class="value" id="cv">'+x.contrast+'%</span></div></div><div class="control"><label>'+t('saturation')+'</label><div class="ctrlRow"><input class="range" id="saturation" type="range" min="0" max="200" value="'+x.saturation+'"><span class="value" id="sv">'+x.saturation+'%</span></div></div><div class="control"><label>'+t('hue')+'</label><div class="ctrlRow"><input class="range" id="hue" type="range" min="-180" max="180" value="'+x.hue+'"><span class="value" id="hv">'+x.hue+'°</span></div></div><div class="control"><label>'+t('blur')+'</label><div class="ctrlRow"><input class="range" id="blur" type="range" min="0" max="12" value="'+x.blur+'"><span class="value" id="blv">'+x.blur+'px</span></div></div><div class="actions" style="margin-top:12px"><button class="mini" data-rot="-90">'+t('rotate')+' ↺</button><button class="mini" data-rot="90">'+t('rotate')+' ↻</button><button class="mini" id="reset">'+t('reset')+'</button><button class="mini" id="favorite">★ '+t('favorites')+'</button></div></section></div>'}
function inspect(){const f=activeFile();return head('FRAME DATA',t('inspect'),f?t('image'):t('empty'))+(f?'<section class="card sidePanel" style="max-width:620px"><div class="meta"><div><b>'+t('name')+'</b><p>'+esc(f.name)+'</p></div><div><b>'+t('type')+'</b><p>'+esc(f.type)+'</p></div><div><b>'+t('size')+'</b><p>'+Math.round(f.size/1024)+' KB</p></div><div><b>'+t('dimensions')+'</b><p id="dims">'+t('none')+'</p></div><div><b>'+t('favorite')+'</b><p>'+(f.favorite?'★':'—')+'</p></div></div></section>':'')}
function settings(){return head('FRAME','Settings',t('themeDesc'))+'<section class="card sidePanel"><div class="setting"><b>'+t('language')+'</b><select id="language" class="field"><option value="en" '+(state.lang==='en'?'selected':'')+'>'+t('english')+'</option><option value="fa" '+(state.lang==='fa'?'selected':'')+'>'+t('persian')+'</option></select></div><div class="setting"><b>'+t('theme')+'</b><small class="muted">'+t('themeDesc')+'</small><div class="themeRow" style="margin-top:10px">'+Object.entries(THEMES).map(([k,v])=>'<button class="themeDot '+(state.theme===k?'active':'')+'" data-theme="'+k+'" style="background:linear-gradient(135deg,'+v[0]+','+v[1]+')" title="'+k+'"></button>').join('')+'</div></div><div class="setting"><b>'+t('animations')+'</b><button class="toggle '+(state.reduced?'on':'')+'" id="reduced" style="width:42px;height:24px;border-radius:99px;border:1px solid var(--line);background:#ffffff08"><i style="display:block;width:16px;height:16px;border-radius:50%;background:var(--a)"></i></button></div><div class="setting"><b>'+t('sound')+'</b><small class="muted">'+t('soundDesc')+'</small><button class="mini" id="sound">'+(state.sound?t('sfxOn'):t('sfxOff'))+'</button></div><div class="setting"><b>AdLand Studio</b><small class="muted">Product navigation</small><div class="actions"><a class="mini" href="https://aradprogramming.github.io/AdLandSite/frame/" target="_blank" rel="noopener">Product site</a><a class="mini" href="https://aradprogramming.github.io/AdLandSite/" target="_blank" rel="noopener">AdLand Site</a></div></div></section>'}
function head(a,b,c){return '<div class="head"><div><div class="ey">'+a+'</div><h1>'+b+'</h1><p>'+c+'</p></div></div>'}
function render(){applyTheme();document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('nGallery').textContent=t('gallery');document.getElementById('nEdit').textContent=t('edit');document.getElementById('nInspect').textContent=t('inspect');document.getElementById('nSettings').textContent=t('settings');document.getElementById('dropHint').textContent=t('drop');document.getElementById('view').innerHTML=page==='gallery'?gallery():page==='edit'?edit():page==='inspect'?inspect():settings();bind();if(page==='edit')applyFilters();if(page==='inspect'){const f=activeFile();if(f){const im=new Image();im.onload=()=>{const d=document.getElementById('dims');if(d)d.textContent=im.naturalWidth+' × '+im.naturalHeight};im.src=f.url}}}
function applyFilters(){const im=document.getElementById('preview');if(!im)return;const x=state.fx;im.style.setProperty('--filters','brightness('+x.brightness+'%) contrast('+x.contrast+'%) saturate('+x.saturation+'%) hue-rotate('+x.hue+'deg) blur('+x.blur+'px)');im.style.setProperty('--rot',x.rotation+'deg')}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>setPage(b.dataset.page));const choose=document.getElementById('choose');if(choose)choose.onclick=()=>document.getElementById('fileInput').click();document.getElementById('openFiles').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>openFiles(e.target.files);document.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{state.active=+b.dataset.file;state.fx={brightness:100,contrast:100,saturation:100,hue:0,blur:0,rotation:0,favorite:state.files[state.active]?.favorite||false};save();setPage('edit')});const dz=document.getElementById('dropzone');if(dz){['dragenter','dragover'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(e=>dz.addEventListener(e,x=>{x.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>openFiles(e.dataTransfer.files))}const controls=[['brightness','bv','%'],['contrast','cv','%'],['saturation','sv','%'],['hue','hv','°'],['blur','blv','px']];controls.forEach(([id,val,suf])=>{const q=document.getElementById(id);if(q)q.oninput=()=>{state.fx[id]=+q.value;document.getElementById(val).textContent=q.value+suf;applyFilters();save()}});document.querySelectorAll('[data-rot]').forEach(b=>b.onclick=()=>{state.fx.rotation=(state.fx.rotation+Number(b.dataset.rot)+360)%360;applyFilters();save();tone()});const compare=document.getElementById('compare');if(compare)compare.onclick=()=>{const pv=document.querySelector('.preview');if(pv){document.body.classList.toggle('compareMode');compare.classList.toggle('active');compare.textContent=document.body.classList.contains('compareMode')?'NORMAL':'COMPARE';tone('success')}};const reset=document.getElementById('reset');if(reset)reset.onclick=()=>{state.fx={brightness:100,contrast:100,saturation:100,hue:0,blur:0,rotation:0,favorite:false};save();render();tone()};const fav=document.getElementById('favorite');if(fav)fav.onclick=()=>{const f=activeFile();if(f){f.favorite=!f.favorite;state.fx.favorite=f.favorite;save();render();tone('success')}};const exp=document.getElementById('export');if(exp)exp.onclick=()=>exportImage();const lang=document.getElementById('language');if(lang)lang.onchange=()=>{state.lang=lang.value;save();render()};document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.theme=b.dataset.theme;save();applyTheme();render()});const rd=document.getElementById('reduced');if(rd)rd.onclick=()=>{state.reduced=!state.reduced;save();render()};const snd=document.getElementById('sound');if(snd)snd.onclick=()=>{state.sound=!state.sound;save();render();if(state.sound)tone('success')}}
function exportImage(){const f=activeFile();if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.filter='brightness('+state.fx.brightness+'%) contrast('+state.fx.contrast+'%) saturate('+state.fx.saturation+'%) hue-rotate('+state.fx.hue+'deg) blur('+state.fx.blur+'px)';ctx.save();ctx.translate(c.width/2,c.height/2);const r=((state.fx.rotation%360)+360)%360;if(r===90||r===270){c.width=im.naturalHeight;c.height=im.naturalWidth;ctx.translate(c.width/2,c.height/2)}ctx.rotate(r*Math.PI/180);ctx.drawImage(im,-im.naturalWidth/2,-im.naturalHeight/2);ctx.restore();const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=(f.name.replace(/\.[^.]+$/,'')||'frame')+'-edited.png';a.click();tone('success');toast(t('export'))};im.src=f.url}
hydrate().then(()=>render()).catch(()=>render());
</script></body></html>
