<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — AdLand Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #080808;
      color: #fff;
      font-family: 'Vazirmatn', 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
    }
    .num {
      font-size: 8rem;
      font-weight: 900;
      background: linear-gradient(135deg, #C9A84C, #F5C842, #A07832);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.5rem; color: rgba(255,255,255,0.7); margin-bottom: 1rem; }
    p { color: rgba(255,255,255,0.4); margin-bottom: 2rem; }
    a {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #C9A84C, #F5C842, #A07832);
      color: #000;
      border-radius: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>صفحه پیدا نشد | Page Not Found</h1>
  <p>این صفحه وجود ندارد یا منتقل شده است.</p>
  <a href="/">بازگشت به خانه | Back Home</a>
</body>
</html>
