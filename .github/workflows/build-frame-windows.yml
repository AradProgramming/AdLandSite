name: Build Frame v1.1.2
on:
  push:
    branches: ["release"]
    paths:
      - "adland-frame/**"
      - ".github/workflows/build-frame-windows.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: adland-frame-build
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: adland-frame
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: frame-v1.1.2
          name: Build Frame v1.1.2
          body: |
            Build Frame v1.1.2 — local image workspace by AdLand Studio.
            
            Windows x64 installer and portable build are attached below.
          files: |
            adland-frame/release/AdLand-Frame-1.1.2
            adland-frame/release/AdLand-Frame-1.1.2
          draft: false
          prerelease: false

# force rebuild after icon configuration fix
