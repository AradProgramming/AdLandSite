name: Build Prism v1.0.0
on:
  push:
    branches: ["release"]
    paths: ["adland-prism/**",".github/workflows/build-prism-windows.yml"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: adland-prism-build, cancel-in-progress: true}
jobs:
  windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: adland-prism}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: prism-v1.0.0
          name: Prism v1.0.0
          body: |
            Prism v1.0.0 — color intelligence lab by AdLand Studio.
            
            Windows x64 installer and portable build are attached below.
          files: |
            adland-prism/release/Prism-1.0.0-Setup.exe
            adland-prism/release/Prism-1.0.0-Portable.exe
          draft: false
          prerelease: false