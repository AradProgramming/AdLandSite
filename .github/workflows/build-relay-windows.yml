name: Build Relay v1.0.0
on:
  push:
    branches: ["release"]
    paths: ["adland-relay/**",".github/workflows/build-relay-windows.yml"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: adland-relay-build, cancel-in-progress: true}
jobs:
  windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: adland-relay}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: relay-v1.0.0
          name: Relay v1.0.0
          body: |
            Relay v1.0.0 — clipboard command center by AdLand Studio.
          files: |
            adland-relay/release/*.exe
          draft: false
          prerelease: false
