name: Roshd CI

on:
  push:
    branches: [main]
    paths:
      - 'roshd-app/**'
      - 'assets/icons/projects/Roshd_icon.svg'
      - '.github/workflows/roshd-ci.yml'
      - 'app-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-android:
    name: Analyze + Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          mkdir -p build-src/assets
          cp -R roshd-app/assets/. build-src/assets/
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Configure Android core library desugaring
        working-directory: build-src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              text = path.read_text(encoding="utf-8")
              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
                          1,
                      )
              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
                  text = text.replace(
                      "isCoreLibraryDesugaringEnabled = true",
                      "isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17",
                      1,
                  )
              if "multiDexEnabled = true" not in text:
                  if "defaultConfig {" in text:
                      text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled = true", 1)
                  else:
                      text = text.replace("android {", "android {\n    defaultConfig {\n        multiDexEnabled = true\n    }", 1)
              if 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' not in text:
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1,
                  )
          elif groovy.exists():
              path = groovy
              text = path.read_text(encoding="utf-8")
              if "coreLibraryDesugaringEnabled true" not in text:
                  if "compileOptions {" in text:
                      text = text.replace(
                          "compileOptions {",
                          "compileOptions {\n        coreLibraryDesugaringEnabled true",
                          1,
                      )
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }",
                          1,
                      )
              if "sourceCompatibility JavaVersion.VERSION_17" not in text:
                  text = text.replace(
                      "coreLibraryDesugaringEnabled true",
                      "coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17",
                      1,
                  )
              if "multiDexEnabled true" not in text:
                  if "defaultConfig {" in text:
                      text = text.replace("defaultConfig {", "defaultConfig {\n        multiDexEnabled true", 1)
                  else:
                      text = text.replace("android {", "android {\n    defaultConfig {\n        multiDexEnabled true\n    }", 1)
              if "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'" not in text:
                  text = text.replace(
                      "dependencies {",
                      "dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                      1,
                  )
          else:
              raise SystemExit("Android Gradle file not found")

          path.write_text(text, encoding="utf-8")
          print(f"Configured {path}")
          PY
      - name: Analyze
        id: analyze
        continue-on-error: true
        working-directory: build-src
        shell: bash
        run: |
          flutter analyze > analyze.log 2>&1
          cat analyze.log
      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roshd-analyzer-report
          path: build-src/analyze.log
          if-no-files-found: error
      - name: Build APK
        working-directory: build-src
        run: flutter build apk --release
