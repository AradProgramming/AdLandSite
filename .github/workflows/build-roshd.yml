name: Build Roshd

on:
  workflow_dispatch:

concurrency:
  group: roshd-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  VERSION: '1.0.0'
  TAG: 'roshd-v1.0.0'

jobs:
  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: \${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          code=$?
          set -e
          if grep -q ' error •' analyze.log; then exit 1; fi
          if [ "$code" -ne 0 ]; then echo "Analyzer reported only infos/warnings; continuing."; fi
      - name: Build APK
        working-directory: build-src
        run: flutter build apk --release
      - name: Build AAB
        working-directory: build-src
        run: flutter build appbundle --release
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          cp build-src/build/app/outputs/flutter-apk/app-release.apk release-assets/Roshd-\${{ env.VERSION }}-Android.apk
          cp build-src/build/app/outputs/bundle/release/app-release.aab release-assets/Roshd-\${{ env.VERSION }}-Android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-android
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: \${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare project
        shell: pwsh
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          Remove-Item -Recurse -Force build-src\lib,build-src\assets,build-src\test -ErrorAction SilentlyContinue
          Copy-Item -Recurse roshd-app\lib build-src\lib
          Copy-Item -Recurse roshd-app\assets build-src\assets
          Copy-Item -Force roshd-app\pubspec.yaml build-src\pubspec.yaml
      - name: Dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: |
          flutter analyze 2>&1 | Tee-Object -FilePath analyze.log
          if (Select-String -Path analyze.log -Pattern ' error •' -Quiet) { exit 1 }
      - name: Build Windows
        working-directory: build-src
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build-src\build\windows\x64\runner\Release\* -DestinationPath Roshd-\${{ env.VERSION }}-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-windows
          path: Roshd-\${{ env.VERSION }}-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: \${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          code=$?
          set -e
          if grep -q ' error •' analyze.log; then exit 1; fi
          if [ "$code" -ne 0 ]; then echo "Analyzer reported only infos/warnings; continuing."; fi
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-\${{ env.VERSION }}-macOS-AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-macos-arm64
          path: Roshd-\${{ env.VERSION }}-macOS-AppleSilicon.zip
          if-no-files-found: error

  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: \${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          code=$?
          set -e
          if grep -q ' error •' analyze.log; then exit 1; fi
          if [ "$code" -ne 0 ]; then echo "Analyzer reported only infos/warnings; continuing."; fi
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-\${{ env.VERSION }}-macOS-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-macos-intel
          path: Roshd-\${{ env.VERSION }}-macOS-Intel.zip
          if-no-files-found: error

  ios:
    name: iOS unsigned
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: \${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          code=$?
          set -e
          if grep -q ' error •' analyze.log; then exit 1; fi
          if [ "$code" -ne 0 ]; then echo "Analyzer reported only infos/warnings; continuing."; fi
      - name: Build iOS
        working-directory: build-src
        run: flutter build ios --release --no-codesign
      - name: Package iOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/ios/iphoneos/Runner.app Roshd-\${{ env.VERSION }}-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-ios
          path: Roshd-\${{ env.VERSION }}-iOS-unsigned.zip
          if-no-files-found: error

  release:
    name: Publish Roshd release
    needs: [android, windows, macos-arm64, macos-intel, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: roshd-*
          path: release-assets
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: \${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "\${{ env.TAG }}" >/dev/null 2>&1; then
            gh release upload "\${{ env.TAG }}" release-assets/* --clobber
          else
            gh release create "\${{ env.TAG }}" release-assets/* \
              --target "\${{ github.sha }}" \
              --title "Roshd 1.0.0" \
              --notes "Roshd | رشد — میز مطالعهٔ فارسی‌محور از AdLand Studio.

Windows x64, macOS Apple Silicon, macOS Intel, Android APK/AAB and an unsigned iOS build are attached.
The iOS artifact is not signed for App Store/TestFlight distribution."
          fi
