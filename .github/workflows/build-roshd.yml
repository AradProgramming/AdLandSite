name: Build Roshd

on:
  push:
    branches: [main]
    paths:
      - 'roshd-app/**'
      - 'roshd/**'
      - 'assets/icons/projects/Roshd_icon.svg'
      - '.github/workflows/build-roshd.yml'
      - 'app-manifest.json'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: roshd-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.5'
  APP_VERSION: '1.0.0'
  TAG: 'roshd-v1.0.0'

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Pub get
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build APK
        working-directory: build-src
        run: flutter build apk --release
      - name: Build AAB
        working-directory: build-src
        run: flutter build appbundle --release
      - name: Upload Android
        uses: actions/upload-artifact@v4
        with:
          name: roshd-android
          path: |
            build-src/build/app/outputs/flutter-apk/app-release.apk
            build-src/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: pwsh
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          Remove-Item -Recurse -Force build-src\lib
          Copy-Item -Recurse roshd-app\lib build-src\lib
          Remove-Item -Recurse -Force build-src\assets
          Copy-Item -Recurse roshd-app\assets build-src\assets
          Copy-Item -Force roshd-app\pubspec.yaml build-src\pubspec.yaml
      - name: Pub get
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build Windows
        working-directory: build-src
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build-src\build\windows\x64\runner\Release\* -DestinationPath Roshd-${{ env.APP_VERSION }}-Windows-x64.zip -Force
      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: roshd-windows
          path: Roshd-${{ env.APP_VERSION }}-Windows-x64.zip
          if-no-files-found: error

  apple:
    name: macOS + iPhone
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Pub get
        working-directory: build-src
        run: flutter pub get
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-${{ env.APP_VERSION }}-macOS.zip
      - name: Build iOS (unsigned)
        working-directory: build-src
        run: flutter build ios --release --no-codesign
      - name: Package iOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/ios/iphoneos/Runner.app Roshd-${{ env.APP_VERSION }}-iOS-unsigned.zip
      - name: Upload Apple builds
        uses: actions/upload-artifact@v4
        with:
          name: roshd-apple
          path: |
            Roshd-${{ env.APP_VERSION }}-macOS.zip
            Roshd-${{ env.APP_VERSION }}-iOS-unsigned.zip
          if-no-files-found: error

  release:
    name: Publish Roshd release
    needs: [android, windows, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: roshd-*
          path: release-assets
          merge-multiple: true
      - name: Rename Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          mv release-assets/app-release.apk release-assets/Roshd-${{ env.APP_VERSION }}-Android.apk
          mv release-assets/app-release.aab release-assets/Roshd-${{ env.APP_VERSION }}-Android.aab
      - uses: actions/checkout@v4
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${{ env.TAG }}" >/dev/null 2>&1; then
            gh release upload "${{ env.TAG }}" release-assets/* --clobber
          else
            gh release create "${{ env.TAG }}" release-assets/* --target "${{ github.sha }}" --title "Roshd 1.0.0" --notes "Roshd | رشد — study planner and focus workspace by AdLand Studio.

Windows x64, macOS, Android APK/AAB and an unsigned iOS build.

The iOS artifact is intentionally unsigned; Apple Developer signing is required for TestFlight/App Store distribution."
          fi
