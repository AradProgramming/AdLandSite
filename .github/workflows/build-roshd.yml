name: Build Roshd

on:
  push:
    branches: [main]
    paths:
      - "roshd-app/**"
      - "roshd/**"
      - "assets/icons/projects/Roshd_icon.svg"
      - "app-manifest.json"
      - ".github/workflows/build-roshd.yml"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"
  APP_VERSION: "1.0.0"
  TAG: "roshd-v1.0.0"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
          rm -rf build-src/test
      - name: Get packages
        working-directory: build-src
        run: flutter pub get
      - name: Format source
        working-directory: build-src
        run: dart format lib
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build APK
        working-directory: build-src
        run: flutter build apk --release
      - name: Build AAB
        working-directory: build-src
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-android
          path: |
            build-src/build/app/outputs/flutter-apk/app-release.apk
            build-src/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare project
        shell: pwsh
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          Remove-Item -Recurse -Force build-src\lib
          Remove-Item -Recurse -Force build-src\assets
          Copy-Item -Recurse roshd-app\lib build-src\lib
          Copy-Item -Recurse roshd-app\assets build-src\assets
          Copy-Item -Force roshd-app\pubspec.yaml build-src\pubspec.yaml
          Remove-Item -Recurse -Force build-src\test
      - name: Get packages
        working-directory: build-src
        run: flutter pub get
      - name: Format source
        working-directory: build-src
        run: dart format lib
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build Windows
        working-directory: build-src
        run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build-src\build\windows\x64\runner\Release\* -DestinationPath Roshd-${ env.APP_VERSION }}-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-windows
          path: Roshd-${ env.APP_VERSION }}-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
          rm -rf build-src/test
      - name: Get packages
        working-directory: build-src
        run: flutter pub get
      - name: Format source
        working-directory: build-src
        run: dart format lib
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-${ env.APP_VERSION }}-macOS-AppleSilicon.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-macos-arm64
          path: Roshd-${ env.APP_VERSION }}-macOS-AppleSilicon.zip
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
          rm -rf build-src/test
      - name: Get packages
        working-directory: build-src
        run: flutter pub get
      - name: Format source
        working-directory: build-src
        run: dart format lib
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-${ env.APP_VERSION }}-macOS-Intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-macos-intel
          path: Roshd-${ env.APP_VERSION }}-macOS-Intel.zip
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
          rm -rf build-src/test
      - name: Get packages
        working-directory: build-src
        run: flutter pub get
      - name: Format source
        working-directory: build-src
        run: dart format lib
      - name: Analyze
        working-directory: build-src
        run: flutter analyze
      - name: Build iOS unsigned
        working-directory: build-src
        run: flutter build ios --release --no-codesign
      - name: Package unsigned
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/ios/iphoneos/Runner.app Roshd-${ env.APP_VERSION }}-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: roshd-ios-unsigned
          path: Roshd-${ env.APP_VERSION }}-iOS-unsigned.zip
          if-no-files-found: error

  release:
    if: ${ github.ref == "refs/heads/main" }}
    needs: [android, windows, macos-arm64, macos-intel, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: roshd-*
          path: release-assets
          merge-multiple: true
      - uses: actions/checkout@v6
      - name: Rename Android artifacts
        shell: bash
        run: |
          mv release-assets/app-release.apk release-assets/Roshd-${ env.APP_VERSION }}-Android.apk
          mv release-assets/app-release.aab release-assets/Roshd-${ env.APP_VERSION }}-Android.aab
      - name: Publish release
        env:
          GH_TOKEN: ${ github.token }}
        shell: bash
        run: |
          if gh release view "${ env.TAG }}" >/dev/null 2>&1; then
            gh release upload "${ env.TAG }}" release-assets/* --clobber
          else
            gh release create "${ env.TAG }}" release-assets/* --target "${ github.sha }}" --title "Roshd 1.0.0" --notes "Roshd | رشد — میز مطالعه و برنامه‌ریزی فارسی‌محور ویژه دانش‌آموزان تیزهوشانی؛ محصول AdLand Studio.\n\nWindows x64, macOS Apple Silicon, macOS Intel, Android APK/AAB and unsigned iOS build.\n\nThe iOS artifact is unsigned; Apple signing is required for normal device installation and App Store/TestFlight distribution."
          fi