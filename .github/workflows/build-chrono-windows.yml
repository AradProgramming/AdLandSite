name: Build Chrono v1.0.0
on:
  push:
    branches: ["release"]
    paths: ["adland-chrono/**",".github/workflows/build-chrono-windows.yml"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: adland-chrono-build, cancel-in-progress: true}
jobs:
  windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: adland-chrono}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: chrono-v1.0.0
          name: Chrono v1.0.0
          body: |
            Chrono v1.0.0 — world clock and time lab by AdLand Studio.
          files: |
            adland-chrono/release/*.exe
          draft: false
          prerelease: false
