name: AdLand macOS Editions
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: adland-macos-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macos/package.json
      - name: Prepare website bundle
        shell: bash
        run: |
          rm -rf macos/site macos/dist macos/node_modules
          mkdir -p macos/site
          rsync -a --exclude ".git" --exclude "macos/site" --exclude "macos/dist" --exclude "macos/node_modules" --exclude "macos/package.json" --exclude "macos/main.cjs" --exclude "macos/electron-builder.config.cjs" ./ macos/site/
      - name: Install packaging dependencies
        working-directory: macos
        run: npm install
      - name: Build all universal macOS editions
        working-directory: macos
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf /tmp/adland-release
          mkdir -p /tmp/adland-release
          slugs=(ai-tools nexus canvas pulse frame atlas forge prism relay echo chrono orbit)
          for slug in "${slugs[@]}"; do
            echo "::group::Building $slug"
            rm -rf dist
            ADLAND_APP_SLUG="$slug" npx electron-builder --config electron-builder.config.cjs --mac --universal
            artifacts=(dist/*.dmg dist/*.zip)
            if [ "${#artifacts[@]}" -lt 2 ]; then
              echo "::error::Expected both a DMG and ZIP for $slug; found ${#artifacts[@]} package(s)."
              ls -lah dist || true
              exit 1
            fi
            cp -f "${artifacts[@]}" /tmp/adland-release/
            echo "Collected ${#artifacts[@]} packages for $slug."
            echo "::endgroup::"
          done
          count="$(find /tmp/adland-release -type f | wc -l | tr -d ' ')"
          echo "Collected $count macOS release packages."
          if [ "$count" -lt "$((${#slugs[@]} * 2))" ]; then
            echo "::error::Release collection is incomplete: expected at least $((${#slugs[@]} * 2)) packages."
            exit 1
          fi
          ls -lah /tmp/adland-release
      - name: Collect release assets
        shell: bash
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          find /tmp/adland-release -type f -print0 | xargs -0 -r -I{} cp "{}" release-assets/
          count="$(find release-assets -type f | wc -l | tr -d ' ')"
          echo "Prepared $count release assets."
          test "$count" -ge 24
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mac-v1.0.0"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "AdLand Studio macOS Editions v1.0.0" --notes "Universal macOS editions for the AdLand Studio ecosystem. Builds target both Apple Silicon and Intel Macs. Direct-download builds are currently unsigned/not notarized until an Apple Developer ID certificate is configured."
          find release-assets -type f -print0 | xargs -0 -r -n20 gh release upload "$TAG" --clobber
