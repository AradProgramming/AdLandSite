name: Roshd Releases

on:
  push:
    branches: [main]
    paths:
      - "roshd-app/**"
      - "roshd/**"
      - "assets/icons/projects/Roshd_icon.svg"
      - "app-manifest.json"
      - "index.html"
      - "sitemap.xml"
      - ".github/workflows/build-roshd-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare Flutter project
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Configure Android core library desugaring
        working-directory: build-src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          desugar_kts = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          desugar_groovy = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")

          if kts.exists():
              path = kts
              text = path.read_text(encoding="utf-8")

              if "isCoreLibraryDesugaringEnabled = true" not in text:
                  m = re.search(r"(?m)^          mv "$apk" release-assets/Roshd-1.0.1-Android.apks*compileOptions\s*\{", text)
                  if m:
                      text = text[:m.end()] + "\n        isCoreLibraryDesugaringEnabled = true" + text[m.end():]
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }",
                          1,
                      )

              if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
                  text = text.replace(
                      "isCoreLibraryDesugaringEnabled = true",
                      "isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17",
                      1,
                  )

              if "multiDexEnabled = true" not in text:
                  m = re.search(r"(?m)^\s*defaultConfig\s*\{", text)
                  if m:
                      text = text[:m.end()] + "\n        multiDexEnabled = true" + text[m.end():]
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n    defaultConfig {\n        multiDexEnabled = true\n    }",
                          1,
                      )

              if desugar_kts not in text:
                  m = re.search(r"(?m)^\s*dependencies\s*\{", text)
                  if m:
                      text = text[:m.end()] + f"\n    {desugar_kts}" + text[m.end():]
                  else:
                      text = text.rstrip() + f"\n\ndependencies {{\n    {desugar_kts}\n}}\n"
              required = [desugar_kts, "isCoreLibraryDesugaringEnabled = true"]

          elif groovy.exists():
              path = groovy
              text = path.read_text(encoding="utf-8")

              if "coreLibraryDesugaringEnabled true" not in text:
                  m = re.search(r"(?m)^\s*compileOptions\s*\{", text)
                  if m:
                      text = text[:m.end()] + "\n        coreLibraryDesugaringEnabled true" + text[m.end():]
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }",
                          1,
                      )

              if "sourceCompatibility JavaVersion.VERSION_17" not in text:
                  text = text.replace(
                      "coreLibraryDesugaringEnabled true",
                      "coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17",
                      1,
                  )

              if "multiDexEnabled true" not in text:
                  m = re.search(r"(?m)^\s*defaultConfig\s*\{", text)
                  if m:
                      text = text[:m.end()] + "\n        multiDexEnabled true" + text[m.end():]
                  else:
                      text = text.replace(
                          "android {",
                          "android {\n    defaultConfig {\n        multiDexEnabled true\n    }",
                          1,
                      )

              if desugar_groovy not in text:
                  m = re.search(r"(?m)^\s*dependencies\s*\{", text)
                  if m:
                      text = text[:m.end()] + f"\n    {desugar_groovy}" + text[m.end():]
                  else:
                      text = text.rstrip() + f"\n\ndependencies {{\n    {desugar_groovy}\n}}\n"
              required = [desugar_groovy, "coreLibraryDesugaringEnabled true"]
          else:
              raise SystemExit("Android Gradle file not found")

          path.write_text(text, encoding="utf-8")
          final = path.read_text(encoding="utf-8")
          missing = [item for item in required if item not in final]
          if missing:
              raise SystemExit("Android desugaring configuration incomplete: " + ", ".join(missing))
          print(f"Configured and validated {path}")
          PY
      - name: Build APK
        working-directory: build-src
        run: flutter build apk --release
      - name: Build AAB
        working-directory: build-src
        run:       - uses: actions/upload-artifact@v4
        with:
          name: Roshd-Android
          path: build-src/build/app/outputs/flutter-apk/app-release.apk
            build-src/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: pwsh
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          if (Test-Path build-src/lib) { Remove-Item -Recurse -Force build-src/lib }
          if (Test-Path build-src/assets) { Remove-Item -Recurse -Force build-src/assets }
          if (Test-Path build-src/test) { Remove-Item -Recurse -Force build-src/test }
          Copy-Item -Recurse roshd-app/lib build-src/lib
          Copy-Item -Recurse roshd-app/assets build-src/assets
          Copy-Item -Force roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build Windows
        working-directory: build-src
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build-src/build/windows/x64/runner/Release/* -DestinationPath Roshd-1.0.1-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-Windows
          path: Roshd-1.0.1-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build macOS Apple Silicon
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS Apple Silicon
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-1.0.1-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-macOS-arm64
          path: Roshd-1.0.1-macOS-arm64.zip
          if-no-files-found: error

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build macOS Intel
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS Intel
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-1.0.1-macOS-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-macOS-intel
          path: Roshd-1.0.1-macOS-intel.zip
          if-no-files-found: error

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build iOS unsigned
        working-directory: build-src
        run: flutter build ios --release --no-codesign
      - name: Package iOS
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/ios/iphoneos/Runner.app Roshd-1.0.1-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-iOS-unsigned
          path: Roshd-1.0.1-iOS-unsigned.zip
          if-no-files-found: error
  release:
    needs: [android, windows, macos-arm64, macos-intel, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Roshd-*
          path: release-assets
          merge-multiple: true
      - name: Rename Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-assets -type f -name 'app-release.apk' -print -quit)"
          aab="$(find release-assets -type f -name 'app-release.aab' -print -quit)"
          test -n "$apk" || { echo "Android APK artifact not found"; find release-assets -maxdepth 6 -type f -print; exit 1; }
          test -n "$aab" || { echo "Android AAB artifact not found"; find release-assets -maxdepth 6 -type f -print; exit 1; }
          mv "$apk" release-assets/Roshd-1.0.1-Android.apk
          mv "$aab" release-assets/Roshd-1.0.0-Android.aab
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="roshd-v1.0.1"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "${{ github.sha }}" --title "Roshd v1.0.1" --notes "Roshd | رشد — میز مطالعه و برنامه‌ریزی فارسی‌محور ویژه دانش‌آموزان تیزهوشانی. Windows x64, macOS, Android APK and iOS unsigned build. Product of AdLand Studio."
          found=0
          while IFS= read -r -d '' asset; do
            found=1
            gh release upload "$TAG" "$asset" --clobber
          done < <(find release-assets -type f -print0)
          test "$found" -eq 1 || { echo "No release files found"; exit 1; }
