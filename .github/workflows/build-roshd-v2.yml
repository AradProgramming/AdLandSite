name: Roshd Releases

on:
  push:
    branches: [main]
    paths:
      - "roshd-app/**"
      - "roshd/**"
      - "assets/icons/projects/Roshd_icon.svg"
      - "app-manifest.json"
      - "index.html"
      - "sitemap.xml"
      - ".github/workflows/build-roshd-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.5"
  APP_VERSION: "1.0.1"
  TAG: "roshd-v1.0.1"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build APK
        working-directory: build-src
        run: flutter build apk --release
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Roshd-Android-APK
          path: build-src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: pwsh
        run: |
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue build-src\lib,build-src\assets,build-src\test
          Copy-Item -Recurse roshd-app\lib build-src\lib
          Copy-Item -Recurse roshd-app\assets build-src\assets
          Copy-Item -Force roshd-app\pubspec.yaml build-src\pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build Windows
        working-directory: build-src
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path build-src\build\windows\x64\runner\Release\* -DestinationPath Roshd-1.0.1-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-Windows
          path: Roshd-1.0.1-Windows-x64.zip
          if-no-files-found: error

  macos-arm64:
    name: macOS Apple Silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-1.0.1-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-macOS-arm64
          path: Roshd-1.0.1-macOS-arm64.zip
          if-no-files-found: error

  macos-intel:
    name: macOS Intel
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build macOS
        working-directory: build-src
        run: flutter build macos --release
      - name: Package macOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/macos/Build/Products/Release/roshd.app Roshd-1.0.1-macOS-intel.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-macOS-intel
          path: Roshd-1.0.1-macOS-intel.zip
          if-no-files-found: error

  ios:
    name: iOS unsigned
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android,ios,windows,macos --org com.adland --project-name roshd build-src
          rm -rf build-src/lib build-src/assets build-src/test
          cp -R roshd-app/lib build-src/lib
          cp -R roshd-app/assets build-src/assets
          cp roshd-app/pubspec.yaml build-src/pubspec.yaml
      - name: Install dependencies
        working-directory: build-src
        run: flutter pub get
      - name: Build iOS unsigned
        working-directory: build-src
        run: flutter build ios --release --no-codesign
      - name: Package iOS
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent build-src/build/ios/iphoneos/Runner.app Roshd-1.0.1-iOS-unsigned.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Roshd-iOS-unsigned
          path: Roshd-1.0.1-iOS-unsigned.zip
          if-no-files-found: error

  release:
    name: Publish Roshd release
    needs: [android, windows, macos-arm64, macos-intel, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Roshd-*
          path: release-assets
          merge-multiple: true
      - name: Rename Android APK
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release-assets -type f -name 'app-release.apk' -print -quit)"
          test -n "$apk" || { echo "Android APK not found"; find release-assets -type f -print; exit 1; }
          mv "$apk" release-assets/Roshd-1.0.1-Android.apk
      - name: Publish release without AAB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" --target "${{ github.sha }}"               --title "Roshd v1.0.1"               --notes "Roshd | رشد — میز مطالعه و برنامه‌ریزی فارسی‌محور ویژه دانش‌آموزان تیزهوشانی. Product of AdLand Studio.

Public downloads: Windows x64, macOS Apple Silicon, macOS Intel, Android APK and an unsigned iOS build. Android AAB is intentionally not published as a public download."
            gh release upload "$TAG" release-assets/* --clobber
          fi
