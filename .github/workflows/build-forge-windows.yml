name: Build Forge v1.0.1
on:
  push:
    branches: ["release"]
    paths: ["adland-forge/**",".github/workflows/build-forge-windows.yml"]
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: adland-forge-build, cancel-in-progress: true}
jobs:
  windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: adland-forge}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-audit --no-fund
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: forge-v1.0.1
          name: Forge v1.0.1
          body: |
            Forge v1.0.1 — developer workbench by AdLand Studio.
            
            Windows x64 installer and portable build are attached below.
          files: |
            adland-forge/release/*.exe
          draft: false
          prerelease: false
# publish-all-exe-forge
